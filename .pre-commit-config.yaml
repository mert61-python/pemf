# PEMF Backend — pre-commit (audit B-2.1: statik analiz/format hook'u yoktu).
# Kurulum:  pip install -r requirements-dev.txt  &&  pre-commit install
# Commit'te YALNIZ değişen dosyalarda çalışır → olgun kodu tek-seferde reformat etmeden
# kademeli iyileştirme sağlar. Ruff config'i pyproject.toml'dan okur (enforced = F + E9).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff            # lint (F + E9) — --fix ile otomatik düzeltilebilirleri uygular
        args: [--fix]
      - id: ruff-format     # format (black-uyumlu) — yalnız değişen dosyalar
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key   # *.p8/*.p12/PEM özel anahtarı commit'e girerse DURDUR

  # ── SIR TARAMASI (denetim 2026-08-04, P0) ──────────────────────────────────
  # NEDEN: `.gitignore` yalnız İZLENMEYEN dosyayı korur; bir kez `git add` edilmiş
  # dosyayı takipten ÇIKARMAZ ve geçmişi TEMİZLEMEZ. Nitekim `config/config.json` +
  # `config/credentials/*` bu depoya 7dd9fec ile girmiş ve PUBLIC `esp` dalında
  # canlı Gmail App Password + HiveMQ MQTT kimliğiyle durmaktadır. gitleaks,
  # aynı sınıf bir sızıntının BİR DAHA commit'e girmesini engelleyen tek kapıdır.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
