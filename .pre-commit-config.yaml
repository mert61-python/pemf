# PEMF Backend — pre-commit (audit B-2.1: statik analiz/format hook'u yoktu).
# Kurulum:  pip install -r requirements-dev.txt  &&  pre-commit install
# Commit'te YALNIZ değişen dosyalarda çalışır → olgun kodu tek-seferde reformat etmeden
# kademeli iyileştirme sağlar. Ruff config'i pyproject.toml'dan okur (enforced = F + E9).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff            # lint (F + E9) — --fix ile otomatik düzeltilebilirleri uygular
        args: [--fix]
        # ⚠️ `training_archive/` DONMUS ARSIV — lint ETME, DUZELTME. Bu agac, yayinlanmis
        # doktora/TUBITAK sonuclarini ureten kodun BIREBIR hali. Olculdu (2026-08-18): ruff
        # ilk gecisinde 316 otomatik duzeltme uygulayip 49 dosyayi yeniden bicimlendirdi —
        # arsivin tek degeri SADAKATI oldugu icin bu bir iyilestirme degil, KAYIPTIR.
        # (Ornek: analysis.py'deki `import torch; torch.cuda.empty_cache()` satiri kasitli.)
        exclude: '^training_archive/'
      - id: ruff-format     # format (black-uyumlu) — yalnız değişen dosyalar
        exclude: '^training_archive/'
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^training_archive/'
      - id: end-of-file-fixer
        # ⚠️ Model artefaktlarina DOKUNMA: `.onnx`/`.pkl` ikili, `best_model.txt` ise uretici
        # betigin yazdigi tek satirlik cikti. Sonuna newline eklemek zararsiz ama gereksiz gurultu.
        # `training_archive/` de ayni sebeple muaf: egitim veri setleri (.csv/.npy/.npz) ve
        # model artefaktlari — icerikleri bilerek DEGISTIRILMEMELI (yeniden fit edilemezler).
        exclude: '^(release_assets/ai_models|training_archive)/'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
        # ⚠️ ISTISNA (denetim 2026-08-18): `release_assets/ai_models/` altindaki 11 dosya BILEREK
        # depoda — yayinlanmis hicbir pakette kopyalari yok, makine kaybinda geri getirilemezlerdi
        # (en buyugu 3,2 MB). Genel 2 MB esigi DEGISMEDI; yalniz bu yol muaf.
        # Gercek tavan (GitHub'in 100 MiB sert siniri) `tests/test_yedek_kapsami.py` ile kilitli:
        # o dizine 100 MiB ustu bir dosya girerse test KIRILIR.
        #
        # ⚠️ IKINCI ISTISNA (2026-08-18): `training_archive/` — silinen `esp` dalindan kurtarilan
        # doktora/TUBITAK egitim arsivi (434 dosya, 296 MB; en buyugu 70 MB). Kaynak veri seti
        # DIS bir makinede (`/home/user02/dr/`) ve depoda YOK; `models_em_kedi/scaler_{X,y}.pkl`
        # uretimdekinden FARKLI ozellik uzayina (10 vs 5) ait, yeniden fit EDILEMEZ. Tek kopyasi
        # versiyonlanmayan yerel bir klasordeydi. Ayni 100 MiB tavani burada da test ile kilitli.
        exclude: '^(release_assets/ai_models|training_archive)/'
      - id: detect-private-key   # *.p8/*.p12/PEM özel anahtarı commit'e girerse DURDUR

  # ── SIR TARAMASI (denetim 2026-08-04, P0) ──────────────────────────────────
  # NEDEN: `.gitignore` yalnız İZLENMEYEN dosyayı korur; bir kez `git add` edilmiş
  # dosyayı takipten ÇIKARMAZ ve geçmişi TEMİZLEMEZ. Nitekim `config/config.json` +
  # `config/credentials/*` bu depoya 7dd9fec ile girmiş ve PUBLIC `esp` dalında
  # canlı Gmail App Password + HiveMQ MQTT kimliğiyle durmaktadır. gitleaks,
  # aynı sınıf bir sızıntının BİR DAHA commit'e girmesini engelleyen tek kapıdır.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
