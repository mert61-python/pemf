# =============================================================================
# PEMF — MİKROSERVİS profili (Faz 3): çekirdek + GPU AI servisi + web, tek ağ.
#   • ai       : GPU inference servisi (:8100)
#   • backend  : çekirdek (auth/DB/orkestrasyon) — AI'yı HTTP ile ai'ya DEVREDER
#                (PEMF_AI_SERVICE_URL=http://ai:8100)
#   • frontend : nginx web (:8080)
# NVIDIA GPU ister.  Çalıştır:  docker compose -f docker-compose.micro.yml up --build -d
# (Monolit/CPU/Mac profili = docker-compose.yml; bayrak YOK → in-process, değişmez.)
# =============================================================================
name: pemf-micro

services:
  ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    image: pemf-ai
    environment:
      PEMF_AI_MODELS_DIR: /models
    volumes:
      - ../release_assets/ai_models:/models:ro
    ports:
      # DENETIM P3: "8100:8100" portu TUM arayuzlere (0.0.0.0) yayinliyordu; ai_service'te
      # kimlik dogrulama YOK → aginizdaki herkes GPU inference'i kullanabilir/kaynak tuketebilir.
      # Servisler ayni compose agindadir; backend ona "http://ai:8100" ile ulasir → host'a
      # yayinlamaya GEREK YOK. Hata ayiklama icin gerekiyorsa YALNIZ loopback'e bagla.
      - "127.0.0.1:8100:8100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: pemf-backend
    environment:
      PEMF_SIMULATE: "1"
      PEMF_REQUIRE_AUTH: "1"                  # /api/ai/* zaten auth-muaf
      PEMF_AI_SERVICE_URL: "http://ai:8100"   # ← AI'yı GPU servisine devret (Faz 3)
    volumes:
      - ../release_assets/ai_models:/models:ro  # devredilmeyen uçlar (em_fantom vb.) in-process
      - pemf_micro_data:/data
    ports:
      - "8000:8000"
    depends_on:
      ai:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ../pf
      dockerfile: ../docker/Dockerfile.frontend
    image: pemf-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pemf_micro_data:
