# =============================================================================
# PETRI KUYUCUK CV KABIN KONFIGURASYONU (Multi-Well)
# (Kedi inference_cat_organ cabin_config paterni — 10 organ x,y,z pattern)
#
# Mantik: Kedi -> 10 organ cabin frame mm
#         Petri -> N kuyucuk cabin frame mm (W1, W2, ..., WN)
#
# Detection : YOLO11m-seg (mAP50=0.984, mAP50-95=0.961, 22.3M param)
# Model     : ../yolo11m-seg.pt (ayni klasor)
# Kalibrasyon: ArUco DICT_5X5_50 (kedi paterni) veya --petri-diameter-cm
# Siniflandirma: HSV mavi piksel sayisi >= threshold -> kanser
# =============================================================================
#
#                  +Y (dorsal/yukari)
#                   ^
#                   |
#                  _____________________
#                 /                    /|
#                /                    / |
#               /   PETRI KABI       /  |  20 cm
#              /   (dairesel jel)   /   |  (yukseklik)
#              /  - beyaz hucre     /    |
#             / - mavi kanser odak /     |
#             /                   /      |
#           ____________________/        |
#       (4) |                    |       |
#    [MARK]→|        ● (3)       |←[KAM](5)
#      sol  |    PETRI MERKEZI   |       |     KAMERA POZISYONU
#      duvar|                    |     /       lens (0, 0, +15)
#           |                    |    /
#  (2)      |                    |   /
# [-10]     |                    |  /
#           |____________________| /  20 cm
#                 20 cm           v   (en)
#               (uzunluk)
#                                 +Z (sag, kamera tarafi)
#
#              ────────────────────────────────────→ +X (lateral)
#
# KALIBRASYON STRATEJISI (oncelik sirasi):
#   1. ArUco marker varsa: solvePnP + kedi paterni (TAM 6-DOF, ray-plane)
#   2. ArUco yoksa: --petri-diameter-cm CLI param ile mm/px kalibrasyon
#                   (YOLO bbox uzun kenari = petri_diameter_cm * 10 mm)
#                   Standart petri capi: 5 cm, 9 cm, 10 cm
#   3. Hicbiri yoksa: piksel modu (mm = px, manuel cevirme)
#
# AXIS:  +X lateral  +Y dorsal  +Z kamera tarafi   <- ⚠️ YUKARIDAKI CIZIM ESKI 20 cm DUZENEK (tarihce).
#        ArUco kipinde GECERLI kabin cercevesi: +X = ONDEN BAKANIN SOLU, +Y yukari, +Z ARKAYA (cat_organ yaml).
#
# =============================================================================


cabin_id: "petri_helmholtz_v1"


# -----------------------------------------------------------------------------
# 1) ArUco — OPSIYONEL (kedi paterni); yoksa --petri-diameter-cm kullan
# -----------------------------------------------------------------------------
aruco:
  dict: DICT_5X5_50              # OpenCV ArUco sozluk
  real_cm: 10.0                    # isaret kenar uzunlugu (saha olcusu 2026-10-14, cetvel; basili sayfa ile AYNI)
  plane_offset_cm: 0.0
  normal_axis_in_cabin: "+Y"     # T2B 2026-10-23: isaret TABAN CAMININ USTUNDE, siyah yuz yukari (tavandaki kameraya)
  refine_corners: true
  use_apriltag_corners: false


# -----------------------------------------------------------------------------
# 2) GEOMETRY — ArUco modunda kullanilir (kedi paterni)
# -----------------------------------------------------------------------------
geometry:
  # TEZGAH-2B OLCUSU 2026-10-23 (sahip serit metre + ArUco; DENETIM TEZGAH-2B.md §2 / §7; eksen kurali: cat_organ yaml).
  # ⚠️ +X = ONDEN BAKANIN SOLU, +Y yukari, +Z arkaya. Kabin ic 55,5 x 35 x 40,5 cm (sol-sag cam x alt-ust cam x on-arka cam).
  # Isaret TABAN CAMININ USTUNDE: siyah kare sol kenari sol camdan 31, on kenari on camdan 14,5 cm -> merkez (-8.25,-17.5,-0.75).
  # Kamera (Pusat FHD) tavan caminin 2 cm ustunde, tepeden bakar. Kamera / isaret kaydirilirsa bu degerler yeniden olculur.
  qr_to_origin_cm: [8.25, 17.5, 0.75]
  cabin_extent_cm: [55.5, 35.0, 40.5]
  axes: "x=lateral,y=dorsal,z=camera"


# -----------------------------------------------------------------------------
# 3) CAMERA — ArUco modunda kullanilir (kedi paterni)
# -----------------------------------------------------------------------------
camera:
  fixed_position_cm: [2.75, 19.5, -12.25]   # lens: sol cam 25 (±1), on cam 8, taban camindan 37 (serit); ArUco'dan (0.65, 21.45, -11.69)
  look_at_cm: [0.0, 0.0, 0.0]
  up_cabin: [0.0, 0.0, 1.0]                 # isaretin UST kenari ARKA duvara (+Z); kameranin goruntu ustu de arka duvar
  to_marker_cm: 40.3
  to_origin_cm: 23.2
  intrinsics_npz: cv_ortak/kalibrasyon/pusat_fhd_1920x1080_M2.npz   # T2D-2: Pusat FHD 1920×1080 (Tezgâh-2 M2, f=1279,8); göreli → YAML dizini, yoksa ai_hub kökü; kenar oranı farklı karede yaklaşık K


# =============================================================================
# PETRI-OZEL ALANLAR
# (Not: phantom_plate/phantom YAML key'leri cabin_config.py loader uyumu icin
#       korundu — anlam petri kabi/petri fiziksel parametreleri)
# =============================================================================

# -----------------------------------------------------------------------------
# 4) PETRI PLATE (geriye uyum; pipeline kullanmiyor — z=0 sabit)
# -----------------------------------------------------------------------------
phantom_plate:
  # HEDEF DUZLEMI (2026-09-09, sahip karari #6): fantom ve petri kabinde YATAY duruyor,
  # DOGRUDAN TABANIN uzerinde (0-2 cm). Kabin ekseni: Y yukari, taban -25 cm, tavan +25 cm.
  # Deger = taban (-25) + malzeme/tepsi kalinligi (~1 cm) -> -24.0 cm.
  # ⚠️ TEZGAHTA OLC ve buraya yaz: kalinlik 1 cm degilse bu sayiyi duzelt (or. 3 mm tepsi ->
  #    -24.7). Eksen "Z" yapilirsa ESKI davranis (kabinin dikey orta duzlemi) geri gelir.
  # ⚠️ OLCUM (2026-09-09, 06b_PetriKuyu_aruco.jpg): eksen "Y" + -24,0 (taban) ile kuyu konumu
  #    (-97 · -24 · +1096) cm cikti = KABIN DISI. Neden: kamera taban hizasinda (Y=-25 cm) ve
  #    hedef duzlemi onun 1 cm ustunde -> isin duzlemi cok SIG bir aciyla kesiyor, kucuk piksel
  #    hatasi metrelere donusuyor. Yani yatay yerlesim MATEMATIKSEL olarak dogru ama MEVCUT kamera
  #    konumuyla sayisal olarak DAYANIKSIZ. Karsilastirma: eksen "Z" + 0,0 -> (-2,3 · +7,7 · 0,0)
  #    cm = kabin ici.
  #    KARAR BEKLIYOR (sahip/hoca): (a) kamerayi yukselt (ust kose/tavan) ya da (b) fantom/petri'yi
  #    kabin ortasi yuksekligine (Y~0) bir platforma al -- (b) fantom modelinin egitim araligiyla da
  #    uyusur (y -6..+6 cm). Karar gelince: hedef_duzlem_eksen "Y" + hedef_duzlem_cm = platform
  #    yuksekligi. O ana kadar ESKI davranis (dikey orta duzlem) korunur ki AI Hub tek-foto analizi
  #    BOZULMASIN.
  # SAHIP OLCUSU 2026-09-09: hedef (fantom/petri) tepsisi tabandan 5 cm -> kabin cercevesinde
  # Y = -25 + 5 = -20.0 cm. Onceki deger ESKI davranisti (dikey orta duzlem, "Z"/0,0).
  # ⚠️ Bu deger TEZGAHTA DOGRULANMADAN surus acilmaz: PEMF_ARASTIRMA_AIPRO 0 kalir
  # (bkz. docs/VERIFICATION.md §15). Kamera lensi taban hizasinda (Y=-25) oldugu icin isin
  # bu duzlemi hala sig bir aciyla keser; okunan konumun kabin ICINDE ve elle olculen yerle
  # ±2 cm uyumlu oldugu gorulmeden bayrak acilmamalidir.
  # ⚠️ TD4 (2026-10-14 saha kabini, Y ±17): -20 cm TABANIN ALTINDA -> ArUco kipinde her hedef "kabin disinda"
  #    reddedilir (fail-closed, olculdu). DEGISTIRILMEDI: tezgah "tepsi yok, plaka yerlesimi kamera kararina bagli"
  #    dedi; yeni lens tabandan yalniz 2 cm (Y=-15) -> taban duzlemi isinla neredeyse PARALEL (sig aci, yukaridaki
  #    2026-09-09 olcumunun aynisi). Kamera yeniden yerlesince plaka duzlemi olculup yazilir (sahibe / Tezgah-2).
  # T2B 2026-10-23: plaka taban caminin ustunde; kuyu tabani camdan ~0,3 cm (hucreler) -> -17.5 + 0.3 = -17.2.
  #    Fantom ayni degeri tasir ("iki YAML bir kabin" kapisi); fantom kalinligi OLCULMEDI — fantom AI Pro KAPALI (Y145).
  hedef_duzlem_eksen: "Y"
  hedef_duzlem_cm: -17.2
  plate_z_cm: 0.0
  width_cm: 5.0                   # sanity check (petri yaklasik cap, cm)
  height_cm: 5.0


# -----------------------------------------------------------------------------
# 5) KANSER HSV (kuyucuk siniflandirmasi: mavi varsa kanser)
# -----------------------------------------------------------------------------
# Her kuyucuk YOLO mask icinde mavi piksel sayilir.
# >= cancer_pixel_threshold (CLI / 30 default) -> organ_id=1 (kanser)
# Aksi -> organ_id=0 (saglikli)
#
#   cancer_blue   -> MAVI piksel araligi (kanser belirteci)
#   healthy_white -> KORUNDU (cabin_config loader uyumu); pipeline kullanmiyor
#                    (YOLO11m-seg kuyucuk tespit eder, HSV beyaz YOK)
segmentation:
  cancer_blue:                    # MAVI piksel araligi (kanser belirteci)
    # S_min=45: belirgin+orta mavi (soluk gri-mavi <30 atilir)
    # V_min=40: cok karanlik leke (yanik tonlari) atilir
    # H=90-135: dar mavi spektrum (cyan/yesil-mavi atilir)
    h_min: 90
    h_max: 135
    s_min: 45
    s_max: 255
    v_min: 40
    v_max: 235
  healthy_white:                  # KORUNDU (loader uyumu); kullanilmiyor
    h_min: 0
    h_max: 179
    s_min: 0
    s_max: 70
    v_min: 100
    v_max: 250
  morphology:
    open_kernel: 3
    close_kernel: 7
    iterations: 1
  adaptive:
    enabled: false
    block_size: 21
    C: 5
  min_area_px: 5000
  max_area_px: 2000000


# -----------------------------------------------------------------------------
# 6) PnP — ArUco modunda kullanilir
# -----------------------------------------------------------------------------
pnp:
  method: "ITERATIVE"
  reprojection_error_px: 3.0
  refine_lm: true


# -----------------------------------------------------------------------------
# 7) PETRI PHYSICS — PetriPredictor varsayilan parametreleri
# -----------------------------------------------------------------------------
phantom:                          # YAML key korundu (cabin_config.py uyumu)
  achieved_B: 0.001               # T (1 mT)
  duty_sum: 2.4


# -----------------------------------------------------------------------------
# 8) CIKTI KATMANLARI
# -----------------------------------------------------------------------------
output:
  json:
    enabled: true
    path: "petri_cv_result.json"
    pretty: true
  fastapi:
    enabled: false
    host: "0.0.0.0"
    port: 8765
  mqtt:
    enabled: false
    broker: "localhost"
    port: 1883
    tls: false
    qos: 1
    keepalive: 60
    client_id: "petri_cv_pipeline"
    topic_state: "pemf/coil/state"
    topic_cmd:   "pemf/coil/cmd"
    username: null
    password: null


# =============================================================================
# KURULUM NOTLARI
# =============================================================================
#
# 0) DETECTION YONTEMI: YOLO11m-seg (ZORUNLU)
#    Model yolu: ../yolo11m-seg.pt (inference_petri_dish/yolo11m-seg.pt)
#    Performans: mAP50=0.984, mAP50-95=0.961, 22.3M param
#    CLI flag'leri:
#      --yolo-conf 0.25         (confidence esiki)
#      --yolo-iou 0.7           (IoU esiki)
#      --yolo-imgsz 640         (inference goruntu boyutu)
#      --yolo-device 0          (GPU 0 veya 'cpu')
#      --yolo-model PATH        (ozel model yolu)
#
# 1) En basit kullanim (ArUco yok, petri capi bilinen):
#      python -m petri_cv.cli -c cabin_config.yaml \
#             -i test.jpg --out results --petri-diameter-cm 5.0
#      (Standart petri kabi capi: 5/6/9/10 cm)
#
# 2) ArUco modu (gercek mm/px + cabin frame):
#      a) Kabin isaretini BAS: ai_hub/PEMF_ArUco_Marker_5X5_50_ID0_10cm_A4.pdf
#         (DICT_5X5_50, kenar 10,0 cm — 2026-10-14 saha olcusu; asagidaki aruco.real_cm ile AYNI olmali;
#          yanlis kenar uzunlugu SESSIZ olcek hatasi verir). Kendin uretmek icin:
#           python -c "import cv2; d=cv2.aruco.getPredefinedDictionary(
#                       cv2.aruco.DICT_5X5_50);
#                       cv2.imwrite('marker.png',
#                       cv2.aruco.generateImageMarker(d,0,500))"
#      b) Kabin sol duvarina yapistir + camera.intrinsics_npz ayarla
#
# 3) cancer_blue SIKI eshik:
#    - S_min<30 = FP riski (gri-mavi yakalanir)
#    - S_min>=45 = sadece BELIRGIN mavi (mevcut)
#    - V_min<40 = kahverengi yanik yakalanir (FP)
#
# 4) Multi-well modu (kedi 10 organ paterni):
#    Pipeline YOLO bulduğu TUM kuyucuklari isler (W1, W2, ..., WN).
#    Sol-ust -> sag-alt sirali numaralanir.
#    En buyuk kuyucuk = origin (cabin frame 0,0,0).
#    Her kuyucuga ayri x,y,z + PetriPredictor + D[7]/P[7]/E_kanser.
#
# 5) Kanser siniflandirma esikleri:
#    --cancer-pixel-threshold N (default 30)
#    Kuyucuk YOLO mask icinde N+ mavi HSV piksel varsa kanser
#    Yuksek N -> daha az kanser (sıkı), Dusuk N -> daha çok kanser (gevşek)
#
# =============================================================================


# =============================================================================
# 9) COK KUYUCUKLU PLAKA (hocanin petri v2'si, 2026-10-02; AI-2 2026-10-12) — izgara tabanli tespit, yeniden egitim yok
# Kaynak: Caglar Hoca `petri_cv_v2/cabin_config_v2.yaml` `multiwell:` bolumu (degisenler.zip SHA-256 0285b1d969f8...).
# Ustteki kabin / ArUco / hedef duzlemi degerleri SAHA OLCUSUDUR (guii) — hocanin 20x20x20 cm / DICT_5X5_100 5 cm
# degerleri ALINMADI (bkz. hafiza "cabin_config_example.yaml ORNEK DEGIL, CALISMA-ANI").
# =============================================================================
multiwell:
  plate_type: 24                  # 12 / 24 / 48 / 96 ; null veya 0 = tekil petri kaplari (eski YOLO kipi)
  # ⚠️ LABORATUVAR VARSAYIMI (hoca §4 #5): A1 kosesi goruntuden OKUNMUYOR.
  # auto: yatay plaka = sol-ust, dikey plaka = sag-ust. Plaka 180 derece cevrildiyse "br" (yatay) / "bl" (dikey).
  a1_corner: auto

  # ⚠️ LABORATUVAR MADDESI (hoca §4 #1): plakanin KABIN konumu — T2B 2026-10-23 DENEY YERI olculdu (ArUco, 3 kare ort.):
  # a1 [161.7, -172.0, -14.1] mm, col [-1, 0, 0], row [0, 0, -1] (serit [157.5, -172.0, -2.5], fark <= 1,2 cm). BILEREK YAZILMADI (T3):
  # dolu iken ISARETSIZ HER plaka fotografi (telefon, baska kabin, hocanin WhatsApp kareleri) bu kabinin deney yerinde sayilip
  # `pemf_valid: true` + AI Pro'da surulebilir oluyordu (T2B B7; T3 olctu). Konum yalniz kabin isaretinden (ArUco) — deneyde isaret gorunur.
  # null -> koordinatlar PLAKA cercevesinde, `pemf_valid: false`. Formul: kabin_xyz = a1_cabin_mm + sutun_mm * col_axis_cabin + satir_mm * row_axis_cabin
  placement:
    a1_cabin_mm: null             # T2B deney yeri olcusu yukarida — sabit tutucu / camda isaretli yer olmadan YAZILMAZ (B7)
    col_axis_cabin: [-1.0, 0.0, 0.0]      # A1 -> A2 (onden bakinca saga = -X) — T2B olcusu
    row_axis_cabin: [0.0, 0.0, -1.0]      # A1 -> B1 (one = -Z) — T2B olcusu

  # ⚠️ LABORATUVAR VARSAYIMI (hoca §4 #4): kanser esikleri YALNIZ YAPAY BOYAYLA dogrulandi.
  # Her deneyde kontrol kuyucuklari verin (orn. control_healthy [A1, D6], control_cancer [B2]) -> esikler o plakaya
  # gore kalibre edilir, kontrol yanlis siniflanirsa `control_cancer_missed` / `control_healthy_flagged` (sonuc kullanilmaz).
  cancer:
    frac: 0.02                    # kuyucukta mavi HSV piksel orani >= -> kanser
    delta_b: 8.0                  # Lab b* referansin bu kadar altinda -> kanser
    abs_b: -5.0                   # mutlak Lab b* <= -> kanser (tum plaka boyali)
    control_healthy: []
    control_cancer: []
