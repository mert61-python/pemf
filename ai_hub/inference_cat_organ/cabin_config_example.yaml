# =============================================================================
# KABIN KONFIGURASYONU — SAHA KABINI (sahip olcusu 2026-10-14, tezgah Oturum 13, serit metre)
# =============================================================================
#
# EKSEN KURALI (kodla OLCULDU — TEZGAH-OTURUM-13.md §F2 "X ayna karari"):
#   origin (0,0,0) = kabin merkezi = coil array merkezi
#   +X = ONDEN BAKANIN SOLU (kedinin kafa yonu, cranial) · +Y = YUKARI (dorsal) · +Z = ARKAYA (derinlik)
#   SAG-EL: +X (sol) x +Y (yukari) = +Z (arkaya, bakanin onunden uzaga)
#   ⚠️ 2026-10-14'e kadar bu dosya "kamera sag-alt-ON = +X", "isaret sol-ust = -21.5" diyordu — koda gore AYNAYDI
#      (+X SOLDUR). Elle olcum yazarken: SAG duvara yakin nokta = NEGATIF X.
#
# OLCULER (2026-10-14):
#   OLCULER 2026-10-23 (TEZGAH-2B: sahip serit metre + ArUco; 2026-10-14 Oturum 13'teki 57 x 34 x 32 ESKI / yanlis):
#   (1) cabin_extent_cm:    [55.5, 35.0, 40.5]   <- ic olcu [X sol-sag cam, Y alt-ust cam, Z on-arka cam]
#                           duvarlar: X = ±27.75 (sol +27.75, sag -27.75) · Y = ±17.5 (taban cami -17.5, tavan cami +17.5)
#                           · Z = ±20.25 (on -20.25, arka +20.25)
#   (2) isaret (ArUco) merkezi: TABAN CAMININ USTUNDE; siyah kare sol kenari sol camdan 31, on kenari on camdan 14,5 cm
#                           => (-8.25, -17.5, -0.75); siyah kare kenari 10,0 cm (cetvel)
#   (3) qr_to_origin_cm:    origin - isaret = (+8.25, +17.5, +0.75)
#   (4) fixed_position_cm:  kamera LENSI (Pusat FHD, tavan caminin 2 cm ustu, tepeden): sol cam 25 · on cam 8 ·
#                           taban camindan 37 cm => (2.75, 19.5, -12.25)
#       to_origin_cm:       |lens|           = sqrt(2.75² + 19.5² + 12.25²) = 23.2 cm
#       to_marker_cm:       |lens - isaret|  = |(11, 37, -11.5)|           = 40.3 cm
#   (5) isaret yuzu (siyah taraf) YUKARI (tavandaki kameraya) => normal_axis_in_cabin: "+Y";
#       kagidin "▲ UST" kenari ARKA DUVARA => camera.up_cabin [0, 0, 1] (taban isaretinde ZORUNLU).
#       ⚠️ Taban isaretinde ters / dondurulmus kagidi kod ANLAMAZ (T2B B3) — yeri ve yonu camda bantla isaretli kalir.
#
# ⚠️ Kamera ya da isaret kaydirilirsa qr_to_origin / fixed_position / to_marker / to_origin yeniden olculur.
#    Kapi: tests/test_kabin_config_65x50x50.py (dosya adi tarihce; olculer guncel).
#
# BASILI ISARET: ai_hub/PEMF_ArUco_Marker_5X5_50_ID0_10cm_A4.pdf (%100 olcekte bas, cetvelle dogrula)
#   — uretim: scripts/kabin_marker_a4.py. Kilavuz: ai_hub/KABIN_KURULUM_KILAVUZU.md
# =============================================================================


cabin_id: "klinik_kose_65x50x50_v2"   # kimlik (tarihce adi); olculer 2026-10-14 saha


aruco:
  dict: DICT_5X5_50            # OpenCV ArUco sozluk adi (basili sayfayla ayni)
  real_cm: 10.0                # isaret siyah kare kenari (saha olcusu 2026-10-14, cetvel; basili sayfa ile AYNI olmali)

  # SADECE tavan setup icin: marker zemine, kedi yatakta -> yatak kalinligi
  # Kose/yan setup'inda 0 (marker ve kedi paralel duzlemde degil)
  plane_offset_cm: 0.0

  # Isaret yuzunun (siyah taraf) baktigi kabin ekseni ((5)): taban cami -> yukari bakar
  normal_axis_in_cabin: "+Y"


geometry:
  # (3): isaret merkezi -> origin vektoru
  qr_to_origin_cm: [8.25, 17.5, 0.75]

  # (1): kabin ic boyutlari [X genislik, Y yukseklik, Z derinlik]
  cabin_extent_cm: [55.5, 35.0, 40.5]

  axes: "x=cranial,y=dorsal,z=right"


camera:
  # (4): kamera lensinin kabin cercevesindeki konumu (cm) — sol cam 25 / on cam 8 / taban camindan 37 (+X = SOL)
  fixed_position_cm: [2.75, 19.5, -12.25]

  look_at_cm: [0.0, 0.0, 0.0]    # kameranin baktigi nokta (default: origin)
  up_cabin: [0.0, 0.0, 1.0]       # isaretin UST kenarinin baktigi kabin ekseni ((5)): arka duvar (+Z)

  # Serit metre validation (sanity check, ±2 cm)
  to_marker_cm: 40.3
  to_origin_cm: 23.2

  # Chessboard kalibrasyon ciktisi. Yoksa to_marker_cm'den approx turetilir.
  # Uretim: python calibrate_camera.py --images chess/ --pattern 9x6 --square-cm 2.5
  intrinsics_npz: cv_ortak/kalibrasyon/pusat_fhd_1920x1080_M2.npz   # T2D-2: Pusat FHD 1920×1080 (Tezgâh-2 M2, f=1279,8); göreli → YAML dizini, yoksa ai_hub kökü; kenar oranı farklı karede yaklaşık K


# =============================================================================
# KURULUM NOTLARI (yaml doldururken kontrol et)
# =============================================================================
#
# 1) DUVAR SINIRI HESABI (+X = ONDEN BAKANIN SOLU)
#    cabin_extent_cm = [55.5, 35, 40.5]  ->  duvarlar X ±27.75 · Y ±17.5 · Z ±20.25 (origin merkez)
#    Isaret TABAN camida (Y=-17.5): merkez X = +27.75 - (sol camdan), Z = -20.25 + (on camdan)
#    2026-10-23: merkez sol camdan 36 (kare sol kenari 31 + 5) / on camdan 19,5 (on kenar 14,5 + 5)
#    -> (-8.25, -17.5, -0.75); qr_to_origin_cm = (+8.25, +17.5, +0.75)
#
# 2) KAMERA: lens konumunu camlardan olc: X = 27.75 - (sol camdan), Y = -17.5 + (taban camindan), Z = -20.25 + (on camdan).
#    Lens koseden iceride kaliyorsa GERCEK lens konumunu olcup fixed_position_cm'e yaz
#    (kamera-sabitli modda en kritik deger budur), to_origin/to_marker'i yeniden hesapla.
#
# 3) MESAFE TUTARLILIK KONTROLU (±2 cm tolerans)
#    to_origin_cm  ==  |fixed_position_cm|              -> |(2.75,19.5,-12.25)| = 23.2  ✓
#    to_marker_cm  ==  |fixed_position_cm - marker_pos|  -> |(11,37,-11.5)|      = 40.3  ✓
#
# 4) MARKER YONU SAGLAMASI
#    Siyah yuz KAMERAYA (taban isaretinde yukari) bakmali -> normal_axis "+Y". Basili sayfadaki "▲ ÜST" arka duvara
#    (duvar isaretinde tavana; ters takilirsa duvar isaretinde hat "marker_upside_down" der, taban isaretinde DEMEZ).
#    Tavan / taban isaretinde (normal "±Y") camera.up_cabin ZORUNLU: isaretin
#    UST kenarinin baktigi kabin ekseni (or. [0, 0, -1]); verilmezse yukleme REDDEDER (donusum tekil olurdu).
#
# 5) PLANE_OFFSET NE ZAMAN KULLANILIR
#    Kose/yan kamera setup (mevcut)     -> 0
#    Tavan kamera + taban marker        -> yatak kalinligi (orn. 2.0)
#
# =============================================================================
