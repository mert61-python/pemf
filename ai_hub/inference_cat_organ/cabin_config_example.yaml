# =============================================================================
# KABIN KONFIGURASYONU — kose kamera (sag-alt-ON), marker ARKA duvar sol-ust
# =============================================================================
#
# ONAYLI GEOMETRI 2026-09-08 — sahip olcusu: genislik 65 · derinlik 50 · yukseklik 50 cm
#   origin (0,0,0) = kabin merkezi = coil array merkezi
#   +X = genislik/uzunluk (kedinin kafa yonu, cranial) · +Y = yukari (dorsal) · +Z = ARKA (derinlik)
#   Duvarlar: X = ±32.5 · Y = ±25 (taban -25, tavan +25) · Z = ±25 (on -25, arka +25)
#
#                  +Y (yukari)
#                   ^
#                   |          ARKA duvar (Z = +25)
#                  __________________________________
#                 /  [MARK] sol-ust                 /|
#                /   merkez (-24.5, +17, +25)      / |
#               /                                 /  |  50 cm
#              /             ● origin            /   |  (yukseklik, Y)
#             /          (coil merkezi)         /    |
#            /_________________________________/     |
#           |                                  |     |
#           |         KEDI (sphinx)            |    /
#           |     ◄kuyruk          kafa►       |   /   50 cm
#           |                                  |  /    (derinlik, Z)
#           |__________________________________| /
#          [KAM] sag-alt-ON kose (32.5, -25, -25) → origin'e bakar
#                          65 cm (genislik, X)
#
#              ────────────────────────────────────→ +X (cranial, kafa yonu)
#
# AXIS:  +X cranial(kafa)  +Y dorsal(yukari)  +Z arka(derinlik)
# SAG-EL: parmaklar +X→+Y kivrildiginda bas parmak +Z
#
# OLCULER:
#   (1) cabin_extent_cm:    [65.0, 50.0, 50.0]   <- [X genislik, Y yukseklik, Z derinlik]
#   (2) marker merkezi:     ARKA duvar, sol duvardan 8 cm, tavandan 8 cm => (-24.5, +17.0, +25.0)
#                           (10 cm marker + 2 cm sessiz bolge kosede tam sigar: kenar 3 cm'de baslar)
#   (3) origin:             kabin merkezi (0, 0, 0) - coil array merkezi
#   (4) qr_to_origin_cm:    origin - marker = (+24.5, -17.0, -25.0)
#   (5) fixed_position_cm:  kamera LENSI sag-alt-ON kosede (32.5, -25.0, -25.0), origin'e bakar
#       to_origin_cm:       |lens|          = sqrt(32.5² + 25² + 25²)   = 48.0 cm
#       to_marker_cm:       |lens - marker| = |(57, -42, -50)|          = 86.7 cm
#   (6) marker yuzu (siyah taraf) kameraya = ONE (-Z) bakar => normal_axis_in_cabin: "-Z"
#
# OCCLUSION NOTU: kamera→marker isini origin'in ~4 cm altindan gecer; kedi origin'de yatarken
#   marker'i KAPATABILIR. Kapatirsa marker'i TAVANA tasi: merkez (0, +25, -10) →
#   qr_to_origin_cm: [0, -25, +10] · to_marker_cm: 61.5 · normal_axis_in_cabin: "-Y".
#   (Kamera-sabitli modda marker = olcek + origin referansi; en kritik dogruluk KAMERA konumu.)
#
# BASILI MARKER: ai_hub/PEMF_ArUco_Marker_5X5_50_ID0_10cm_A4.pdf (%100 olcekte bas, cetvelle
#   dogrula) — uretim: scripts/kabin_marker_a4.py. Kilavuz: ai_hub/KABIN_KURULUM_KILAVUZU.md
# =============================================================================


cabin_id: "klinik_kose_65x50x50_v2"


aruco:
  dict: DICT_5X5_50            # OpenCV ArUco sozluk adi (basili sayfayla ayni)
  real_cm: 10.0                # marker siyah kare kenari (cetvel/kumpas olcumu)

  # SADECE tavan setup icin: marker zemine, kedi yatakta -> yatak kalinligi
  # Kose/yan setup'inda 0 (marker ve kedi paralel duzlemde degil)
  plane_offset_cm: 0.0

  # Marker yuzunun (siyah taraf) baktigi cabin ekseni (diyagramda (6)): arka duvar -> one bakar
  normal_axis_in_cabin: "-Z"


geometry:
  # Diyagramda (4): marker merkezi -> origin vektoru
  qr_to_origin_cm: [24.5, -17.0, -25.0]

  # Diyagramda (1): kabin ic boyutlari [X genislik, Y yukseklik, Z derinlik]
  cabin_extent_cm: [65.0, 50.0, 50.0]

  axes: "x=cranial,y=dorsal,z=right"


camera:
  # Diyagramda (5): kamera lens'in cabin frame'indeki konumu (cm) — sag-alt-ON kose
  fixed_position_cm: [32.5, -25.0, -25.0]

  look_at_cm: [0.0, 0.0, 0.0]    # kameranin baktigi nokta (default: origin)
  up_cabin: [0.0, 1.0, 0.0]       # cabin "up" yonu (default: +Y dorsal)

  # Serit metre validation (sanity check, ±2 cm)
  to_marker_cm: 86.7
  to_origin_cm: 48.0

  # Chessboard kalibrasyon ciktisi. Yoksa to_marker_cm'den approx turetilir.
  # Uretim: python calibrate_camera.py --images chess/ --pattern 9x6 --square-cm 2.5
  intrinsics_npz: null


# =============================================================================
# KURULUM NOTLARI (yaml doldururken kontrol et)
# =============================================================================
#
# 1) DUVAR SINIRI HESABI
#    cabin_extent_cm = [65, 50, 50]  ->  duvarlar X ±32.5 · Y ±25 · Z ±25 (origin merkez)
#    Marker ARKA duvarda (Z=+25), sol-ust: merkez = (-32.5+8, +25-8, +25) = (-24.5, +17, +25)
#    qr_to_origin_cm = -marker_pos = (+24.5, -17, -25)
#
# 2) KAMERA: sag-alt-ON kosede, lens kabin ICINDE koseye mumkun oldugunca yakin.
#    Lens koseden iceride kaliyorsa GERCEK lens konumunu olcup fixed_position_cm'e yaz
#    (kamera-sabitli modda en kritik deger budur), to_origin/to_marker'i yeniden hesapla.
#
# 3) MESAFE TUTARLILIK KONTROLU (±2 cm tolerans)
#    to_origin_cm  ==  |fixed_position_cm|              -> |(32.5,-25,-25)| = 48.0  ✓
#    to_marker_cm  ==  |fixed_position_cm - marker_pos|  -> |(57,-42,-50)|   = 86.7  ✓
#
# 4) MARKER YONU SAGLAMASI
#    Siyah yuz KAMERAYA (one) bakmali -> normal_axis "-Z". Basili sayfadaki "▲ ÜST" tavana.
#
# 5) PLANE_OFFSET NE ZAMAN KULLANILIR
#    Kose/yan kamera setup (mevcut)     -> 0
#    Tavan kamera + taban marker        -> yatak kalinligi (orn. 2.0)
#
# =============================================================================
