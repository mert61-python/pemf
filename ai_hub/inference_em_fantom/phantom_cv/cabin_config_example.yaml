# =============================================================================
# SENTETIK BOBREK FANTOM MODELI KABIN KONFIGURASYONU
# (Kedi inference_cat_organ cabin_config paterni)
# =============================================================================
#
#                  +Y (dorsal/yukari)
#                   ^
#                   |
#                  _____________________
#                 /                    /|
#                /                    / |
#               / SENTETIK BOBREK    /  |  20 cm
#              / FANTOM MODELI      /   |  (yukseklik)
#             /  - beyaz silikon   /    |
#            / - mavi tumor odak  /     |
#           /                    /      |
#           ____________________/       |
#       (4) |                    |      |
#    [MARK]→|        ● (3)       |←[KAM](5)
#      sol  |    FANTOM MERKEZI  |      |     KAMERA POZISYONU
#      duvar|                    |     /      lens (0, 0, +15)
#           |                    |    /
#  (2)      |                    |   /
# [-10]     |                    |  /
#           |____________________| /  20 cm
#                 20 cm           v   (en)
#               (uzunluk)
#                                 +Z (sag, kamera tarafi)
#
#              ────────────────────────────────────→ +X (lateral)
#
# KALIBRASYON STRATEJISI (oncelik sirasi):
#   1. ArUco marker varsa: solvePnP + kedi paterni (TAM 6-DOF)
#   2. ArUco yoksa: --phantom-length-cm CLI param ile mm/px kalibrasyon
#                   (fantom bbox uzun kenari = phantom_length_cm)
#   3. Hicbiri yoksa: piksel modu (mm = px, manuel cevirme)
#
# AXIS:  +X lateral  +Y dorsal  +Z kamera tarafi
#
# =============================================================================


cabin_id: "phantom_helmholtz_v1"


# -----------------------------------------------------------------------------
# 1) ArUco — OPSIYONEL (kedi paterni); yoksa --phantom-length-cm kullan
# -----------------------------------------------------------------------------
aruco:
  dict: DICT_5X5_50              # OpenCV ArUco sozluk
  real_cm: 15.0                    # marker kenar uzunlugu (sahip olcumu 2026-09-09; basili sayfa ile AYNI)
  plane_offset_cm: 0.0
  normal_axis_in_cabin: "-Z"     # marker ARKA duvarda, siyah yuzu one (kameraya) bakar
  refine_corners: true
  use_apriltag_corners: false


# -----------------------------------------------------------------------------
# 2) GEOMETRY — ArUco modunda kullanilir (kedi paterni)
# -----------------------------------------------------------------------------
geometry:
  # ONAYLI GEOMETRI 2026-09-08 (sahip olcusu 65x50x50): marker ARKA duvar sol-ust,
  # merkezi (-21.5,+14,+25) -> origin vektoru; kamera sag-alt-ON kose. Ayrinti: cat_organ yaml.
  # (2026-09-09: 15 cm isaret icin merkez 8/8 -> 11/11 cm tasindi; sessiz bolge duvardan tasmasin.)
  qr_to_origin_cm: [21.5, -14.0, -25.0]
  cabin_extent_cm: [65.0, 50.0, 50.0]
  axes: "x=lateral,y=dorsal,z=camera"


# -----------------------------------------------------------------------------
# 3) CAMERA — ArUco modunda kullanilir (kedi paterni)
# -----------------------------------------------------------------------------
camera:
  fixed_position_cm: [32.5, -25.0, -25.0]
  look_at_cm: [0.0, 0.0, 0.0]
  up_cabin: [0.0, 1.0, 0.0]
  to_marker_cm: 83.3
  to_origin_cm: 48.0
  intrinsics_npz: null            # null -> approx intrinsics (mavi peak'ten)


# =============================================================================
# FANTOM-OZEL ALANLAR
# =============================================================================

# -----------------------------------------------------------------------------
# 4) FANTOM PLATE (gerigeri uyum; pipeline kullanmiyor — z=0 sabit)
# -----------------------------------------------------------------------------
phantom_plate:
  # HEDEF DUZLEMI (2026-09-09, sahip karari #6): fantom ve petri kabinde YATAY duruyor,
  # DOGRUDAN TABANIN uzerinde (0-2 cm). Kabin ekseni: Y yukari, taban -25 cm, tavan +25 cm.
  # Deger = taban (-25) + malzeme/tepsi kalinligi (~1 cm) -> -24.0 cm.
  # ⚠️ TEZGAHTA OLC ve buraya yaz: kalinlik 1 cm degilse bu sayiyi duzelt (or. 3 mm tepsi ->
  #    -24.7). Eksen "Z" yapilirsa ESKI davranis (kabinin dikey orta duzlemi) geri gelir.
  # ⚠️ OLCUM (2026-09-09, 06b_PetriKuyu_aruco.jpg): eksen "Y" + -24,0 (taban) ile kuyu konumu
  #    (-97 · -24 · +1096) cm cikti = KABIN DISI. Neden: kamera taban hizasinda (Y=-25 cm) ve
  #    hedef duzlemi onun 1 cm ustunde -> isin duzlemi cok SIG bir aciyla kesiyor, kucuk piksel
  #    hatasi metrelere donusuyor. Yani yatay yerlesim MATEMATIKSEL olarak dogru ama MEVCUT kamera
  #    konumuyla sayisal olarak DAYANIKSIZ. Karsilastirma: eksen "Z" + 0,0 -> (-2,3 · +7,7 · 0,0)
  #    cm = kabin ici.
  #    KARAR BEKLIYOR (sahip/hoca): (a) kamerayi yukselt (ust kose/tavan) ya da (b) fantom/petri'yi
  #    kabin ortasi yuksekligine (Y~0) bir platforma al -- (b) fantom modelinin egitim araligiyla da
  #    uyusur (y -6..+6 cm). Karar gelince: hedef_duzlem_eksen "Y" + hedef_duzlem_cm = platform
  #    yuksekligi. O ana kadar ESKI davranis (dikey orta duzlem) korunur ki AI Hub tek-foto analizi
  #    BOZULMASIN.
  # SAHIP OLCUSU 2026-09-09: hedef (fantom/petri) tepsisi tabandan 5 cm -> kabin cercevesinde
  # Y = -25 + 5 = -20.0 cm. Onceki deger ESKI davranisti (dikey orta duzlem, "Z"/0,0).
  # ⚠️ Bu deger TEZGAHTA DOGRULANMADAN surus acilmaz: PEMF_ARASTIRMA_AIPRO 0 kalir
  # (bkz. docs/VERIFICATION.md §15). Kamera lensi taban hizasinda (Y=-25) oldugu icin isin
  # bu duzlemi hala sig bir aciyla keser; okunan konumun kabin ICINDE ve elle olculen yerle
  # ±2 cm uyumlu oldugu gorulmeden bayrak acilmamalidir.
  hedef_duzlem_eksen: "Y"
  hedef_duzlem_cm: -20.0
  plate_z_cm: 0.0
  width_cm: 8.5                   # sanity check (fantom yaklasik boyut)
  height_cm: 13.0


# -----------------------------------------------------------------------------
# 5) RENK SEGMENTASYON — SIKI eshik (FP minimize)
# -----------------------------------------------------------------------------
#   cancer_blue   -> MAVI noktalar (tumor odaklari, organ_id=1)
#   healthy_white -> BEYAZ silikon fantom dokusu (organ_id=0)
#   (find_phantom watershed ile mask'i ayrik fantomlara boluyor)
segmentation:
  cancer_blue:                    # MAVI noktalar -> tumor (SIKI: FP engelle)
    # S_min=45: belirgin+orta mavi (soluk gri-mavi <30 atilir)
    # V_min=40: cok karanlik leke (yanik tonlari) atilir
    # H=90-135: dar mavi spektrum (cyan/yesil-mavi atilir)
    h_min: 90
    h_max: 135
    s_min: 45
    s_max: 255
    v_min: 40
    v_max: 235
  healthy_white:                  # BEYAZ silikon bobrek fantomu
    # H umursamaz, S<70 (krem ve beyaz), V>100 (parlak)
    h_min: 0
    h_max: 179
    s_min: 0
    s_max: 70
    v_min: 100
    v_max: 250
  morphology:
    open_kernel: 3                # healthy mask icin (find_phantom)
    close_kernel: 11              # delik doldurma
    iterations: 1
  adaptive:
    enabled: false
    block_size: 21
    C: 5
  min_area_px: 5000               # find_phantom adaptif kullanir
  max_area_px: 2000000


# -----------------------------------------------------------------------------
# 6) PnP — ArUco modunda kullanilir
# -----------------------------------------------------------------------------
pnp:
  method: "ITERATIVE"
  reprojection_error_px: 3.0
  refine_lm: true


# -----------------------------------------------------------------------------
# 7) FANTOM PHYSICS — PhantomPredictor varsayilan parametreleri
# -----------------------------------------------------------------------------
phantom:
  achieved_B: 0.001               # T (1 mT)
  duty_sum: 2.4


# -----------------------------------------------------------------------------
# 8) CIKTI KATMANLARI
# -----------------------------------------------------------------------------
output:
  json:
    enabled: true
    path: "phantom_cv_result.json"
    pretty: true
  fastapi:
    enabled: false
    host: "0.0.0.0"
    port: 8765
  mqtt:
    enabled: false
    broker: "localhost"
    port: 1883
    tls: false
    qos: 1
    keepalive: 60
    client_id: "phantom_cv_pipeline"
    topic_state: "pemf/coil/state"
    topic_cmd:   "pemf/coil/cmd"
    username: null
    password: null


# =============================================================================
# KURULUM NOTLARI
# =============================================================================
#
# 1) En basit kullanim (ArUco yok, fantom uzunlugu bilinen):
#      python -m phantom_cv.cli -c cabin_config.yaml \
#             -i test.jpg --out results --phantom-length-cm 10.0
#
# 2) ArUco modu (gercek mm/px + cabin frame):
#      a) Kabin isaretini BAS: ai_hub/PEMF_ArUco_Marker_5X5_50_ID0_15cm_A4.pdf
#         (DICT_5X5_50, kenar 15,0 cm — asagidaki aruco.real_cm ile AYNI olmali;
#          yanlis kenar uzunlugu SESSIZ olcek hatasi verir). Kendin uretmek icin:
#           python -c "import cv2; d=cv2.aruco.getPredefinedDictionary(
#                       cv2.aruco.DICT_5X5_50);
#                       cv2.imwrite('marker.png',
#                       cv2.aruco.generateImageMarker(d,0,500))"
#      b) Kabin sol duvarina yapistir + camera.intrinsics_npz ayarla
#
# 3) RENK ESHIK KALIBRASYONU
#    Yeni isik altinda gercek goruntu ile ayarla:
#      python -c "import cv2; img=cv2.imread('foto.jpg');
#                  hsv=cv2.cvtColor(img,cv2.COLOR_BGR2HSV);
#                  print(hsv[y,x])"
#
# 4) cancer_blue SIKI eshik:
#    - S_min<30 = FP riski (gri-mavi gri-yesil yakalanir)
#    - S_min>=45 = sadece BELIRGIN mavi (mevcut)
#    - V_min<40 = kahverengi yanik yakalanir (FP)
#
# 5) Tek fantom modu:
#    Pipeline `max_phantoms=1` default — en yuksek skorlu segment secilir.
#    Multi-fantom istersen color_segment.find_phantoms(max=N) cagri.
#
# =============================================================================
