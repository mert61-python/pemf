# =============================================================================
# PEMF Gateway - HiveMQ Cloud Native Bridge
# =============================================================================
# Mosquitto 2.0.18 + OpenSSL 3.1.2 (libcrypto-3-x64.dll / libssl-3-x64.dll)
# Her ikisi C:\Program Files\mosquitto\ altında MEVCUT ve GÜNCEL (v3.1.2 ✓)
#
# KURULUM:
#   1. CA sertifikasını yerleştir:
#      Copy-Item config\certs\isrg_root_x1.pem 'C:\Program Files\mosquitto\certs\'
#   2. gui_bridge şifresini al:
#      python -m services.credential_manager generate → gui_bridge password
#   3. Bu dosyayı kopyala:
#      MosquittoManager.install_config_files() otomatik yapar
#   4. Mosquitto'yu yeniden başlat: net stop mosquitto && net start mosquitto
# =============================================================================

# --- BRIDGE BAĞLANTISI ---
connection hivemq-bridge
address 8593bfdb2f324ad88d08b54b5e37c0a9.s1.eu.hivemq.cloud:8883

# --- KİMLİK DOĞRULAMA ---
# gui_bridge: Sadece pemf/# okuma/yazma yetkisine sahip, sınırlı bridge kullanıcısı
# Şifreyi almak için: python -m services.credential_manager export --hivemq
remote_username gui_bridge
remote_password AywU&dDiVZSjjaYON11GXkNync5Kv$fs

# --- TLS/SSL ---
# OpenSSL 3.1.2 DLL'leri Mosquitto dizininde mevcut (doğrulandı) ✓
bridge_tls_version tlsv1.2
bridge_insecure false
bridge_cafile C:/Program Files/mosquitto/certs/isrg_root_x1.pem

# --- TOPIC BRIDGE ---
# Tüm pemf/ topic'lerini çift yönlü bridge et
# Format: topic <pattern> <direction> <QoS> <local_prefix> <remote_prefix>
topic pemf/# both 1

# --- BRIDGE DURUMU ---
# Bridge bağlantı durumunu yerel topic olarak yayınla
notifications true
notification_topic pemf/bridge/status

# --- BAĞLANTI DAVRANIŞI ---
# Clean session false: offline'dayken biriken mesajları online olunca gönder
cleansession false

# Bridge client ID
# clientid: HiveMQ Cloud'da unique olmalı
clientid mosquitto_bridge_lattepanda

# --- YENİDEN BAĞLANMA ---
# Internet kopunca otomatik yeniden bağlan
restart_timeout 10 30
# İlk bekleme 10sn, sonra 30sn'de bir dene

# --- BRIDGE START ---
# automatic: Mosquitto başladığında bridge'i başlat
start_type automatic

# --- QoS ---
# Bridge üzerinden geçen mesajların QoS seviyesi
bridge_max_packet_size 8192

# --- IDLE TIMEOUT ---
# Boşta kalma süresi (saniye) - 0 = kapatma
keepalive_interval 60
