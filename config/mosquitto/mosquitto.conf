# =============================================================================
# PEMF Gateway - Mosquitto MQTT Broker Yapilandirmasi
# =============================================================================
# LattePanda üzerinde çalışan yerel MQTT broker.
# ESP32-S3 cihazları WiFi hotspot üzerinden bu broker'a bağlanır.
# Internet varsa HiveMQ Cloud'a bridge yapar.
# =============================================================================

# --- GENEL AYARLAR ---
# Listener: Tüm arayüzlerden bağlantı kabul et (hotspot dahil)
listener 1883 0.0.0.0

# --- KİMLİK DOĞRULAMA ---
# GERÇEK DURUM (P0-3 denetimi): ESP32 firmware'i broker'a ANON bağlanıyor (BLE provisioner yalnız
# WiFi+host/port gönderiyor, MQTT kimlik bilgisi göndermiyor). Bu yüzden allow_anonymous=false
# yapmak bobin 6-8'i KOPARIR → şu an açık KALMALI. UYGULANAN SAVUNMA KATMANLARI:
#   (a) Broker firewall'la YALNIZ hotspot subnet'ine (192.168.137.0/24) açık → klinik LAN'a KAPALI.
#   (b) Hotspot WPA2 şifresi GÜÇLÜ + cihaz-başına BENZERSİZ olmalı (zayıf 'pemf1234' default'unu DEĞİŞTİRİN).
# MQTT auth'u GERÇEKTEN açmak için: ESP firmware'ini credential gönderecek şekilde güncelleyin
# (credential_manager esp_coil_X şeması hazır) + BLE provisioner'a kullanıcı/şifre ekleyin, sonra:
# allow_anonymous false
# password_file C:/ProgramData/mosquitto/passwd
allow_anonymous true

# --- PERSISTENCE (Offline Veri Koruma) ---
persistence true
persistence_location C:/ProgramData/mosquitto/data/
autosave_interval 60
autosave_on_changes true

# --- MESAJ KUYRUĞU ---
# Offline'dayken biriken mesajları sakla
max_queued_messages 10000
max_queued_bytes 0
max_inflight_messages 40

# --- BAĞLANTI LİMİTLERİ ---
# 8 ESP + 1 GUI + 1 Android + bridge + yedek = ~15
max_connections 20

# --- KEEPALIVE ---
# Bağlantı kopma tespiti
max_keepalive 120

# --- RETAIN ---
# Session ve ACK mesajları için retained message desteği
retain_available true

# --- LOGLAMA ---
log_dest file C:/ProgramData/mosquitto/log/mosquitto.log
log_type error
log_type warning
# audit #19: notice/information 7/24'te (ESP reconnect/subscribe akışı) log dosyasını
# sınırsız şişiriyordu → KAPATILDI (yalnız error+warning). Mosquitto'da yerleşik log-rotation
# YOK; daha ayrıntı gerekirse OS-düzeyi logrotate (Linux) / Windows zamanlanmış görev ile döndürün.
# log_type notice
# log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- BRIDGE KONFIGURASYON ---
# Bridge yapılandırması ayrı dosyada (internet varsa aktif)
include_dir C:/ProgramData/mosquitto/conf.d
