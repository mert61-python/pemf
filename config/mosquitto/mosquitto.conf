# =============================================================================
# PEMF Gateway - Mosquitto MQTT Broker Yapilandirmasi
# =============================================================================
# LattePanda üzerinde çalışan yerel MQTT broker.
# ESP32-S3 cihazları WiFi hotspot üzerinden bu broker'a bağlanır.
# Internet varsa HiveMQ Cloud'a bridge yapar.
# =============================================================================

# --- GENEL AYARLAR ---
# Listener: Tüm arayüzlerden bağlantı kabul et (hotspot dahil)
listener 1883 0.0.0.0

# --- KİMLİK DOĞRULAMA ---
# UYARI (audit P1): allow_anonymous=true iken hotspot ağına KATILAN HERKES bobin 6-8'e
# komut publish edebilir; tek koruma katmanı hotspot WPA2 şifresidir. ÜRETİMDE kapatın:
#   1) ESP32 firmware'ine MQTT kullanıcı/şifre tanımlayın.
#   2) Backend'e PEMF_MQTT_USER / PEMF_MQTT_PASS env verin (kod tarafı zaten destekliyor).
#   3) `mosquitto_passwd -c C:/ProgramData/mosquitto/passwd <user>` ile şifre dosyası üretin.
#   4) Aşağıdaki iki satırı açıp bu satırı silin:
# allow_anonymous false
# password_file C:/ProgramData/mosquitto/passwd
allow_anonymous true

# --- PERSISTENCE (Offline Veri Koruma) ---
persistence true
persistence_location C:/ProgramData/mosquitto/data/
autosave_interval 60
autosave_on_changes true

# --- MESAJ KUYRUĞU ---
# Offline'dayken biriken mesajları sakla
max_queued_messages 10000
max_queued_bytes 0
max_inflight_messages 40

# --- BAĞLANTI LİMİTLERİ ---
# 8 ESP + 1 GUI + 1 Android + bridge + yedek = ~15
max_connections 20

# --- KEEPALIVE ---
# Bağlantı kopma tespiti
max_keepalive 120

# --- RETAIN ---
# Session ve ACK mesajları için retained message desteği
retain_available true

# --- LOGLAMA ---
log_dest file C:/ProgramData/mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- BRIDGE KONFIGURASYON ---
# Bridge yapılandırması ayrı dosyada (internet varsa aktif)
include_dir C:/ProgramData/mosquitto/conf.d
