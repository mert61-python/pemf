name: frontend-ci

# PEMF mobil/web frontend — tip-denetimi (tsc) + testler (jest-expo, 22 test).
# NOT: React 19 / RN 0.85 bleeding-edge → bazı test araçları peer-dep çakışması verir;
# kurulum --legacy-peer-deps ile yapılır (yerelde de böyle kuruldu).

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Lint (ESLint — audit B-10.1)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (jest)
        run: npm test
