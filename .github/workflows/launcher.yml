# PEMF Vet Client launcher — Windows paketi (etiketle / elle).
#
# NEDEN CI: Tauri cross-compile EDİLEMEZ (Windows WebView2). Paket kendi işletim sisteminde üretilmek ZORUNDA; kişisel makinede
# kaldığı sürece paketler elden ele taşınır, sürümler ayrışır.
#
# CT2 g (istem 66 · Y320 / Y326 katman 11): ürün platformu YALNIZ Windows (Y320, sahip 25-11 — Docker / Linux / macOS tarafında
# çalışma yok). Matris eskiden macOS (arm64, imza + notarization) + Ubuntu 22.04 + Windows derliyordu → yalnız Windows kaldı; macOS
# imzalama / notarization / DMG ve Linux WebKitGTK adımları kaldırıldı (git geçmişinde). Yayın eserleri yine yayın makinesinde üretilir
# (Y327: kod imzalama sertifikası ALINMAYACAK — katman 4 / 5 YAPILMAYACAK). Kapı: tests/test_CT2g_launcher_YALNIZ_windows.py
name: Launcher Release

on:
  workflow_dispatch: {}
  push:
    tags: ["launcher-v*"]

env:
  CARGO_TERM_COLOR: always

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact: PEMFVetClient-windows

    steps:
      # DENETIM 2026-08-04: action'lar DEGISTIRILEBILIR ref'lerle cagriliyordu. `@v4`/`@v2`
      # TASINABILIR etiketlerdir; `dtolnay/rust-toolchain@stable` ise bir DALDIR (dogrulandi:
      # `git/ref/heads/stable` cozumlendi). Ref'i degistiren birinin CI'da kod calistirmasi
      # demektir → COMMIT SHA'ya pinlendi (CT2 e: artik TUM is akislarinda, kapi test_CT2e).
      # Yukseltirken: `git ls-remote --tags https://github.com/<owner>/<repo>` → yorumdaki surumu de guncelle (Dependabot da acar).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # `stable` DALININ action.yml'si `toolchain: default: stable` tasir → SHA pin davranisi
      # DEGISTIRMEZ; yine de acikca belirtiyoruz (ileride master'a pinlenirse de dogru kalsin).
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable dali
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: launcher

      # Testler ÖNCE: bozuk çekirdekle paket üretmenin anlamı yok.
      # DENETİM 2026-08-04: `--locked` YOKTU. Workspace bağımlılıkları geniş caret aralıklarıyla
      # tanımlı (`zip = "2"`, `tauri = "2"`, `ureq = "2"`) → kilit dosyası tutarsız/eski kaldığında
      # cargo onu SESSİZCE günceller ve yayın paketi kayıt altına ALINMAMIŞ sürümlerle üretilir.
      # `--locked` kilit ile Cargo.toml ayrışırsa BURADA (paketlemeden önce) sert hata verir.
      - name: Çekirdek testleri
        working-directory: launcher
        run: cargo test --locked --lib

      # --- Bağımlılık güvenlik denetimi (DENETİM 2026-08-04, P3) ----------------
      # Launcher imzasız bir setup.exe indirip `/S` ile SESSİZCE kuran ve klinik makinesinde
      # backend'i başlatan bileşendir → zincirdeki bir açık doğrudan dağıtım bütünlüğünü
      # etkiler. `--deny warnings` + gerekçeli yoksayma listesi (launcher/.cargo/audit.toml) →
      # LİSTEDE OLMAYAN her yeni uyarı/açık CI'yı kırar. Yoksayma listesine ASLA gerçek bir
      # güvenlik açığı eklenmez (bkz. dosyadaki politika notu). (CT2 g: eskiden yalnız Ubuntu satırında koşuyordu → Windows.)
      - name: Bağımlılık güvenlik denetimi (cargo audit)
        working-directory: launcher
        run: |
          cargo install cargo-audit --locked --version ^0.22
          cargo audit --deny warnings

      # DENETIM 2026-08-04 (P1): `@^2` = o an yayindaki HERHANGI bir 2.x -> paketleyici her CI kosusunda npm'den TAZE cekiliyordu.
      # npm tedarik zinciri kirilirsa zehirli kurulum uretilirdi ve launcher'in SHA256'si bunu YAKALAYAMAZDI (hash zehirlenmis
      # artefakttan uretilir). TAM SURUME sabitlendi. Yukseltirken: `npm view @tauri-apps/cli version`.
      - name: Tauri bundle (Windows)
        working-directory: launcher/app
        run: npx --yes @tauri-apps/cli@2.11.4 build --ci   # sabit surum

      - name: Paketleri topla
        shell: bash
        run: |
          mkdir -p dist-launcher
          find launcher/target/release/bundle -type f -name "*.exe" -exec cp {} dist-launcher/ \;
          ls -lh dist-launcher

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist-launcher/*
          if-no-files-found: error
