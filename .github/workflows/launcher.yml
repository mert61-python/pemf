# PEMF Vet Client launcher — üç platform TEK kaynaktan.
#
# NEDEN CI: Tauri cross-compile EDİLEMEZ (Windows WebView2, Linux WebKitGTK, macOS
# WebKit). Her paket kendi işletim sisteminde üretilmek ZORUNDA. Bu iş kişisel
# makinelerde yapıldığı sürece paketler elden ele taşınır, sürümler ayrışır ve
# (bir kez olduğu gibi) kaynak kaybolur.
#
# macOS notarization da BURADA koşar → kimsenin Mac'i beklenmez.
name: Launcher Release

on:
  workflow_dispatch: {}
  push:
    tags: ["launcher-v*"]

env:
  CARGO_TERM_COLOR: always

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Sırlar JOB seviyesinde env'e alınır: adımın KENDİ `env:` bloğu o adımın
    # `if:` koşulunda GÖRÜNMEZ (koşul env'den önce değerlendirilir) — böyle
    # yazılırsa imzalama/notarization adımları sessizce hiç çalışmaz.
    env:
      # DENETIM 2026-08-04 (P2): Apple imzalama/notarization SIRLARI burada, JOB seviyesindeydi →
      # AYNI job'daki HER adim onlari okuyabiliyordu; ucuncu-parti action'lar (checkout,
      # rust-toolchain, rust-cache, upload-artifact) dahil. Sirlar artik YALNIZ ihtiyaci olan
      # adimlarin KENDI `env:` blogunda. Burada kalan sey SIR DEGIL, yalnizca VAR/YOK bayragi —
      # `if:` kosullari adim-seviyesi env'i GOREMEDIGI icin (kosul env'den once degerlendirilir)
      # bu bayraklar job seviyesinde olmak ZORUNDA. Bayraklar "true"/"false" string'idir.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID != '' }}
    strategy:
      fail-fast: false # bir platform düşerse diğerleri yine de üretilsin
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-14
            artifact: PEMFVetClient-macos
          - name: Windows (x64)
            os: windows-latest
            artifact: PEMFVetClient-windows
          - name: Linux (x64)
            os: ubuntu-22.04
            artifact: PEMFVetClient-linux

    steps:
      # DENETIM 2026-08-04: action'lar DEGISTIRILEBILIR ref'lerle cagriliyordu. `@v4`/`@v2`
      # TASINABILIR etiketlerdir; `dtolnay/rust-toolchain@stable` ise bir DALDIR (dogrulandi:
      # `git/ref/heads/stable` cozumlendi). Imzalama sirlarinin bulundugu bir job'da bu,
      # ref'i degistiren birinin CI'da kod calistirmasi demektir → COMMIT SHA'ya pinlendi.
      # Yukseltirken: `gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha`
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # WebKitGTK + Tauri'nin Linux bağımlılıkları (yalnız Linux).
      - name: Linux sistem bağımlılıkları
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential file rpm

      # `stable` DALININ action.yml'si `toolchain: default: stable` tasir → SHA pin davranisi
      # DEGISTIRMEZ; yine de acikca belirtiyoruz (ileride master'a pinlenirse de dogru kalsin).
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable dali
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: launcher

      # Testler ÖNCE: bozuk çekirdekle paket üretmenin anlamı yok.
      # DENETİM 2026-08-04: `--locked` YOKTU. Workspace bağımlılıkları geniş caret aralıklarıyla
      # tanımlı (`zip = "2"`, `tauri = "2"`, `ureq = "2"`) → kilit dosyası tutarsız/eski kaldığında
      # cargo onu SESSİZCE günceller ve yayın paketi kayıt altına ALINMAMIŞ sürümlerle üretilir.
      # `--locked` kilit ile Cargo.toml ayrışırsa BURADA (paketlemeden önce) sert hata verir.
      - name: Çekirdek testleri
        working-directory: launcher
        run: cargo test --locked --lib

      # --- Bağımlılık güvenlik denetimi (DENETİM 2026-08-04, P3) ----------------
      # Launcher imzasız bir setup.exe indirip `/S` ile SESSİZCE kuran ve klinik makinesinde
      # backend'i başlatan bileşendir → zincirdeki bir açık doğrudan dağıtım bütünlüğünü
      # etkiler. Denetimde zincir tarandı: 439 crate, 0 açık, 17 "bakımsız" uyarısı (hepsi
      # Tauri'nin Linux GTK3 bağımlılıkları + idna→unic-*; bizim kodumuzdan erişilemez).
      # `--deny warnings` + gerekçeli yoksayma listesi (launcher/.cargo/audit.toml) →
      # LİSTEDE OLMAYAN her yeni uyarı/açık CI'yı kırar. Yoksayma listesine ASLA gerçek bir
      # güvenlik açığı eklenmez (bkz. dosyadaki politika notu).
      # Tek platformda koşar: Cargo.lock platformdan bağımsızdır, 3 kez taramak gereksiz.
      - name: Bağımlılık güvenlik denetimi (cargo audit)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: launcher
        run: |
          cargo install cargo-audit --locked --version ^0.22
          cargo audit --deny warnings

      # --- macOS imzalama kimliği (notarization'ın ön koşulu) ------------------
      # Sertifika CI Secrets'ta durur; çalışma ağacında ASLA (bkz. .gitignore).
      - name: macOS imzalama sertifikasını yükle
        if: matrix.os == 'macos-14' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PW" $KEYCHAIN
          security set-keychain-settings -t 3600 -u $KEYCHAIN
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" $KEYCHAIN
          rm -f cert.p12
          security find-identity -v -p codesigning

      # --- Paketleme ------------------------------------------------------------
      # macOS'ta yalnız .app üretilir; .dmg'yi build_dmg.sh yapar çünkü tauri'nin
      # kendi dmg adımı Finder'ı AppleScript ile sürüyor ve HEADLESS RUNNER'DA DÜŞÜYOR.
      - name: Tauri bundle (macOS → .app)
        if: matrix.os == 'macos-14'
        working-directory: launcher/app
        # tauri-bundler macOS imzalamada bu degiskenleri KENDISI de okuyabildigi icin adim
        # seviyesinde veriliyor (job seviyesinden kaldirildi — bkz. yukaridaki DENETIM notu).
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        # DENETIM 2026-08-04 (P1): `@^2` = o an yayindaki HERHANGI bir 2.x -> paketleyici
        # her CI kosusunda npm'den TAZE cekiliyordu ve bu adim APPLE_CERTIFICATE /
        # APPLE_API_KEY_P8 sirlarinin env'de oldugu, keychain'e imzalama kimliginin
        # yuklendigi bir baglamda kosuyor. npm tedarik zinciri kirilirsa IMZALI +
        # NOTARIZE EDILMIS tibbi cihaz kurulumu uretilirdi ve launcher'in SHA256'si bunu
        # YAKALAYAMAZDI (hash zehirlenmis artefakttan uretilir). TAM SURUME sabitlendi.
        # Yukseltirken: `npm view @tauri-apps/cli version` -> bu iki satiri BIRLIKTE guncelle.
        run: npx --yes @tauri-apps/cli@2.11.4 build --ci --bundles app

      - name: DMG üret (AppleScript'siz)
        if: matrix.os == 'macos-14'
        working-directory: launcher
        env:
          PEMF_CODESIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./build_dmg.sh

      - name: Tauri bundle (Windows / Linux)
        if: matrix.os != 'macos-14'
        working-directory: launcher/app
        run: npx --yes @tauri-apps/cli@2.11.4 build --ci   # sabit surum — bkz. macOS adimindaki DENETIM notu

      # --- Notarization (yalnız imzalıysa anlamlı) ------------------------------
      # Ön koşul: Apple Developer hesabının GÜNCEL sözleşmeleri KABUL EDİLMİŞ olmalı.
      # Kabul edilmemişse gönderim "In Progress"te saatlerce asılı kalır — kod ya da
      # imza hatası sanılır. Bu adım o durumda zaman aşımıyla AÇIKÇA başarısız olur.
      - name: Notarize + staple
        if: matrix.os == 'macos-14' && env.HAS_APPLE_API_KEY == 'true'
        working-directory: launcher
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -1)
          echo "$APPLE_API_KEY_P8" | base64 --decode > key.p8
          xcrun notarytool submit "$DMG" \
            --key key.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m
          rm -f key.p8
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # Gatekeeper'ın gerçekten kabul ettiğini DOĞRULA (staple tek başına yetmez).
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      - name: Paketleri topla
        shell: bash
        run: |
          mkdir -p dist-launcher
          find launcher/target/release/bundle -type f \
            \( -name "*.dmg" -o -name "*.exe" -o -name "*.deb" \
               -o -name "*.AppImage" -o -name "*.rpm" \) \
            -exec cp {} dist-launcher/ \;
          ls -lh dist-launcher

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-launcher/*
          if-no-files-found: error
