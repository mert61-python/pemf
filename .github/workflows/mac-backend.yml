# PEMF native macOS backend — base.zip / base-linux.zip'in macOS karşılığı.
# linux-backend.yml'in eşleniği; farkı build_mac.sh'ı çağırması (sürüm/pin
# mantığı tek yerde dursun diye adımlar burada TEKRARLANMAZ).
#
# macos-14 = Apple Silicon runner → mac-arm64 paketi. PyInstaller cross-compile
# etmediği için bu iş başka hiçbir runner'da yapılamaz.
name: macOS Backend Build

on:
  workflow_dispatch: {}
  push:
    tags: ["backend-mac-v*"]

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
# DENETİM 2026-08-04 (P3): action pinlemesi bu dosyada YARIMDI — yalnız üçüncü-parti
# `dtolnay/rust-toolchain` SHA'ya bağlanmıştı. Ama bu job Apple İMZALAMA SIRLARINA erişiyor;
# GitHub-sahipli action'lar da mutable etiketle çekiliyordu (etiket taşınabilir). Hepsi pinlendi.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA-pinli)

      - name: Python 3.10 (requirements.txt bu sürüme kilitli)
        run: brew install python@3.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (SHA-pinli)
        with:
          node-version: 20

      # build_mac.sh: ön koşul kontrolü → venv → macOS'a uyarlanmış requirements
      # (torch '+cpu' etiketi mac'te YOK) → sqlcipher doğrulaması → frontend export
      # → PyInstaller → zip + sha256.
      - name: base-mac.zip üret
        env:
          PEMF_CODESIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./build_mac.sh

      # Paketin gerçekten AÇILIP ÇALIŞTIĞINI doğrula — zip üretmek yetmez.
      # (Bu test, sembolik linkleri düz dosya olarak açan bir hatayı yakalamıştı:
      # _internal/Python bozulunca backend hiç başlamıyordu.)
      # DENETİM 2026-08-04 (P3): `@stable` DEĞİŞKEN bir git ref'idir — üçüncü-parti depo ele
      # geçirilirse bu iş akışı, Apple İMZALAMA SIRLARINA erişimi olan bir işte saldırganın
      # kodunu çalıştırır. launcher.yml'de SHA'ya pinlenmişti; burada atlanmıştı.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable dali
        with:
          toolchain: stable
      - name: Paket doğrulama + uçtan uca açılış testi
        working-directory: launcher
        env:
          PEMF_LAUNCHER_E2E: "1"
        run: cargo test --test real_artifacts -- --test-threads=1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (SHA-pinli)
        with:
          name: PEMF-Backend-macOS
          path: |
            base-mac.zip
            base-mac.sha256.txt
          if-no-files-found: error
