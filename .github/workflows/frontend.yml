name: frontend-ci

# PEMF mobil/web frontend — tip-denetimi (tsc) + testler (jest-expo).
# ⚠️ MONOREPO (2026-08-18): kaynak `apps/ui/` alt dizinine tasindi. Bu dosya KOK
# `.github/workflows/` altinda DURMAK ZORUNDA — GitHub yalnizca kokteki workflow'lari
# calistirir; `apps/ui/.github/workflows/` altinda kalsaydi CI SESSIZCE hic kosmazdi.
# NOT: React 19 / RN 0.85 bleeding-edge → bazı test araçları peer-dep çakışması verir;
# kurulum --legacy-peer-deps ile yapılır (yerelde de böyle kuruldu).

on:
  push:
    # ⚠️ Dal listesi DIGER workflow'larla AYNI olmali: `feature/**` ve `fix/**` eksikti,
    # yani konu dalinda frontend kapisi HIC kosmuyordu (feature/monorepo'da olculdu).
    branches: [ main, master, production-hardening, "feature/**", "fix/**", "duzeltme/**" ]
    # ⚠️ YOL FILTRESI (monorepo): backend/launcher/firmware degisikligi Expo+jest hattini
    # tetiklemesin. Filtre YOKKEN tek satirlik bir Python degisikligi bu isi de kosturuyordu.
    # ⚠️ ISTISNA (D1.105, Y8 bekcisi): acil durdurma TEYIT sozlesmesini tasiyan backend dosyalari (api_server: confirmed /
    # ESP satiri; live_state: WS) degisince istemcinin "yedek adimlar teyitten bagimsiz" jest kapisi KOSMALI.
    # Kapi: tests/test_D1105_Y8_jest_bekcisi_backend_teyit_degisince_KOSAR.py
    paths: [ "apps/ui/**", ".github/workflows/frontend.yml", "apps/backend/servers/api_server.py", "apps/backend/servers/live_state.py" ]
  pull_request:
    paths: [ "apps/ui/**", ".github/workflows/frontend.yml", "apps/backend/servers/api_server.py", "apps/backend/servers/live_state.py" ]
  workflow_dispatch:

# Ayni dal icin eski kosuyu iptal et (tests.yml'de zaten vardi, burada YOKTU).
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ui

jobs:
  test:
    # CT2 a: iş adı scripts/ci_sozlesmesi.json `kosulluysa_gerekli` ile AYNI (yol süzgeçli — koştuysa yeşil olmalı)
    name: frontend (lint + tsc + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0        # CT1 f-3: fark kapsamı tabanı (birleşme tabanı) için tam geçmiş

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # YS1f (26-11): Node 20 -> 22. 20 desteği bitti (2026-04) ve @supabase/realtime-js Node < 22de yerleşik WebSocket
          # bulamayınca istemciyi KURARKEN atıyordu -> supabaseAuth.ts içe aktaran 28 jest süiti yüklenemedi; ESLint adımı kırmızıyken
          # jest hiç koşmadığı için görünmüyordu (geliştirici makinesi Node 26). site.yml ile aynı ders. Kapı: test_ci_workflow_gate.py
          node-version: "22"
          cache: npm
          # ⚠️ `defaults.working-directory` YALNIZ `run:` adimlarini etkiler, `uses:` action'larini
          # DEGIL. Bu yol verilmezse setup-node kokteki (bos, artik) package-lock.json'a gore
          # onbellekler — yanlis anahtar, ise yaramaz onbellek.
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Lint (ESLint — audit B-10.1)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      # Y243 (KP-2 A5): `--coverage` → jest.config.js `coverageThreshold` UYGULANIR (eşik altı kapsam işi kırar).
      - name: Unit tests (jest)
        run: npm test -- --coverage

      # CT1 f-3 (istem 66 · Y311 / Y325): dalın değiştirdiği her ölçülen satır testle koşmuş olmalı (fark kapsamı %100; jest lcov).
      # Eşikler (coverageThreshold) tests/kapsam_tabani.json'dan. Kapı: tests/test_CT1f_kapsam_tabani_KILIDI.py
      - name: Fark kapsamı kapısı
        working-directory: .
        run: python3 scripts/fark_kapsami.py --lcov apps/ui/coverage/lcov.info:apps/ui
