name: security-audit

# Bağımlılık CVE taraması (audit B-9.3). pip-audit ile web/API çekirdek bağımlılıkları (kurulu
# ortam üzerinden — torch+cpu/UTF-8 çözümleme sorunlarını atlar) OSV/PyPI advisory DB'ye karşı taranır.
# BLOKLAYICI DEĞİL (continue-on-error): web/crypto CVE'leri YAMALI (cryptography 43.0.1,
# starlette 1.3.1, python-multipart 0.0.31 — 2026-07 fix'leri). Kalan bilinen-CVE yalnız AI-çekirdeği
# (onnx 1.15 / torch 2.1.2) — numpy<2 cascade'i yüzünden BİLİNÇLİ pinli (Dependabot izler).
# Kapsamlı tarama (torch/onnx dahil TÜM ağaç) Dependabot ile (.github/dependabot.yml) yürür.

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # her Pazartesi 06:00 UTC
  workflow_dispatch:

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core deps + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install pip-audit

      - name: pip-audit — çekirdek + SHIPPED AI ağacı (bilgi amaçlı, bloklamaz)
        # Audit P2: shiplenen AI yığını (torch 2.1.2 / onnx 1.15 / ultralytics / xgboost / librosa...) da
        # TARANSIN — eskiden yalnız requirements-test.txt kuruluyordu → AI-CVE'leri (CVE-2025-32434 dahil)
        # HİÇ görünmüyordu. requirement-file modu kurulum gerektirmez. Bilinen-ertelenen (torch→2.6.0
        # ayrı görev) DIŞINDA yeni CVE'ler burada GÖRÜNÜR. Bloklayıcı yapmak için known-CVE'leri
        # --ignore-vuln <ID> ile allowlist'le + continue-on-error'ı kaldır (sahip: exact ID gerekir).
        continue-on-error: true
        run: |
          echo "== kurulu çekirdek ortam (web/crypto) =="
          pip-audit --desc || true
          echo "== SHIPPED ağaç (requirements.txt — AI yığını DAHİL) =="
          pip-audit -r requirements.txt --desc || true
