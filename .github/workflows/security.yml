name: security-audit

# Bağımlılık CVE taraması (audit B-9.3) — CT2 e (istem 66 · Y326 katman 8): artık BLOKLAYICI.
# Eskiden `continue-on-error` + her satırda `|| true` → açık bulunsa da iş yeşildi (bilgi amaçlı). Şimdi cargo audit deseni
# (launcher/.cargo/audit.toml): yalnız `scripts/audit_borcu.json`'daki gerekçeli liste yoksayılır —
#   · `uygulanamaz`: bu üründe erişilemeyen tavsiyeler (gerçek açık ASLA eklenmez)
#   · `bilinen_borc`: 28-11 ölçümünde VAR olan gerçek açıklar (yükseltme kararı [SAHİBE]; Y3: onnx / torch SABİT — kabul edilmiş risk).
#     CIRCIR: liste yalnız küçülür; listede OLMAYAN YENİ açık bu işi KIRMIZI yapar (sessiz yeni açık biter).
# pip-audit sürümü = derleme kilidindeki (build_tools/myenv-requirements.txt `pip_audit==`). ⚠️ D6.56: torch / torchvision `+cpu`
# PyPI'da YOK → pip-audit onları ATLAR (torch CVE'leri bu adımda GÖRÜNMEZ) — GitHub güvenlik uyarıları yolu (A-42).
# Kapı: tests/test_CT2e_tedarik_zinciri_KAPILARI.py
# Y320: ubuntu koşucuda kalır (ürün platformu değil). Python yaması burada ÖNEMSİZ: `--no-deps --disable-pip` kurulum / çözümleme
# yapmaz, yalnız sabit ad + sürümü tavsiye veritabanına sorar (ubuntu-22.04/24.04'te 3.10.2 tekerleği de yok — scripts/ci_sozlesmesi.json).

on:
  # ⚠️ 2026-08-09 (Tier 1): tetikleyici yalnız `main, master` idi ve geliştirme AKTİF DALDA
  # yapıldığı için bu iş akışı sahadaki hiçbir değişiklikte KOŞMUYORDU. Aktif dal + konu-dal
  # desenleri eklendi (bkz. tests.yml'deki aynı düzeltme).
  push:
    branches: [ main, master, production-hardening, "feature/**", "fix/**", "duzeltme/**" ]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # her Pazartesi 06:00 UTC
  workflow_dispatch:

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"

      - name: pip-audit kur (sürüm = derleme kilidi)
        run: pip install "$(grep -i '^pip_audit==' build_tools/myenv-requirements.txt)"

      # D3.41 (B-9.15): kurtarma kilidi sevk edilen paketin TAMAMINI pinler (geçişliler dahil) — çözümleme / kurulum YOK.
      - name: pip-audit — SEVK kilidi (bloklayıcı; yalnız gerekçeli liste yoksayılır)
        run: pip-audit -r build_tools/myenv-requirements.txt --no-deps --disable-pip --desc $(python scripts/ci_audit.py pip-yoksay)

      - name: pip-audit — test bağımlılıkları (bloklayıcı)
        run: pip-audit -r requirements-test.txt --no-deps --disable-pip --desc $(python scripts/ci_audit.py pip-yoksay)

  # CT2 e: npm ağaçları (apps/ui — EXE web dışa aktarımı + APK · apps/web — ÖDEME sitesi · DEMA — backend'le sevk edilen dist) kilit
  # dosyasından denetlenir (`--package-lock-only`, kurulum yok). Karar scripts/ci_audit.py'de (npm audit'in yoksayma listesi yok).
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: npm audit (apps/ui · apps/web · DEMA — bloklayıcı; yalnız gerekçeli liste yoksayılır)
        shell: bash
        run: |
          set -euo pipefail
          for d in apps/ui apps/web "dema-terapi-simülatörü"; do
            (cd "$d" && npm audit --package-lock-only --json --audit-level=none > "$RUNNER_TEMP/npm-audit.json")
            python3 scripts/ci_audit.py npm "$d" "$RUNNER_TEMP/npm-audit.json"
          done
