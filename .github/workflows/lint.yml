name: lint

# PEMF backend statik analiz (audit B-2.1). Ruff config'i pyproject.toml'dan okur
# (enforced = F + E9 = gerçek buglar; stil kuralları kademeli). Baseline temiz → yeşil.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff==0.15.20

      - name: Ruff lint (F + E9 — pyproject.toml)
        run: ruff check --output-format=github .

      - name: Ruff format check (bilgi amaçlı — hata verse de iş başarısız olmaz)
        run: ruff format --check . || true
