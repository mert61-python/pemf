name: lint

# PEMF backend statik analiz (audit B-2.1). Ruff config'i pyproject.toml'dan okur
# (enforced = F + E9 = gerçek buglar; stil kuralları kademeli). Baseline temiz → yeşil.
on:
  # ⚠️ 2026-08-09 (Tier 1): tetikleyici yalnız `main, master` idi ve geliştirme AKTİF DALDA
  # yapıldığı için bu iş akışı sahadaki hiçbir değişiklikte KOŞMUYORDU. Aktif dal + konu-dal
  # desenleri eklendi (bkz. tests.yml'deki aynı düzeltme).
  push:
    branches: [ main, master, production-hardening, "feature/**", "fix/**", "duzeltme/**" ]
  pull_request:
  workflow_dispatch:

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          # CT2 b: ruff kendi ikilisidir — yorumlayıcı yamasına bağlı değil (hedef sürüm pyproject `target-version`); ubuntu-22.04 /
          # 24.04'te 3.10.2 tekerleği yok. Ürün Python'u (3.10.2) ürün kodunu KOŞAN Windows işlerinde (scripts/ci_sozlesmesi.json).
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff==0.15.20

      - name: Ruff lint (F + E9 — pyproject.toml)
        run: ruff check --output-format=github .

      - name: Ruff format check (bilgi amaçlı — hata verse de iş başarısız olmaz)
        run: ruff format --check . || true
