name: critical-path-tests

# PEMF kritik-yol testleri — backend (pytest, Windows) + launcher (cargo) + sır taraması.
# YS1b · Y320 (sahip 25-11): CI YALNIZ Windows ürün hattı — backend `ubuntu-latest` kopyası ve Linux / macOS paketleme iş akışları
# (`linux-backend.yml`, `mac-backend.yml`) kaldırıldı (git geçmişinde). lint / security / site / frontend Ubuntu koşucuda kalır
# (ürün platformu değil, yalnız CI makinesi).
# (Arayüz/site işleri için dosyanın SONUNDAKİ "KALDIRILDI (2026-08-12)" notuna bakınız.)
#
# CT2 (istem 66 · Y326 — endüstri standardı CI katmanları):
#   · Katman 6 HIZLI PUSH + GECE TAM: `CI_KIP` (scripts/ci_hizli_kume.py) — production-hardening / main / master push'u, gece
#     (gece.yml → bu iş akışı `kip: tam`), elle `kip=tam` ve geniş etkili değişiklik TAM süit + paket toplamı; diğer dallar değişen
#     alanlara göre HIZLI küme (paket toplamı ölçülmez, dalın değişen satırlarının fark kapsamı %100 HER kipte zorunlu).
#   · Katman 1: her push'ta koşan işler (iş adları) scripts/ci_sozlesmesi.json `gerekli_isler`de — yayın betiği ve CT3 dal
#     koruması AYNI listeyi okur. Gece işi gerekli DEĞİL (yayın commit'ine durum yazmaz).
#   · Katman 2: Python = ürünün GÖNDERDİĞİ yama (`urun_python`, sevk ağacı python310.dll) · Katman 7: junit özeti iş sayfasında,
#     kapsam raporu eser, `ozet` işi dal / commit başına TEK tablo · Katman 8: her `uses:` tam SHA (yorumda sürüm) ·
#   · Katman 9: `firmware` işi STM32'yi resmî Arm GNU 12.3.rel1 (CubeIDE ile aynı GCC 12.3.1) ile derler + bilgisayar koşum
#     takımı testleri gcc + gcov (kart yazılımı kapsam tabanı + fark kapsamı). Kapılar: tests/test_CT2*.py
#
# ⚠️ DENETİM 2026-08-09 (Tier 1) — CI GERÇEKTEN AÇILDI. Önceki hâlinde:
#   • tetikleyici yalnız `main, master` idi; geliştirme AKTİF DALDA (production-hardening)
#     yapıldığı için iş akışı sahadaki hiçbir değişiklikte KOŞMUYORDU,
#   • yalnız `ubuntu-latest` vardı; oysa ÜRÜN WINDOWS'ta çalışıyor ve launcher/ProgramData/
#     DPAPI/güvenlik-duvarı yollarının tamamı Windows'a özgü — hiç test edilmiyordu,
#   • `cargo test` yalnız `launcher-v*` TAG'inde koşuyordu (yani yayından SONRA),
#   • arayüz için `tsc --noEmit` ve `jest` HİÇ koşmuyordu.
# Sonuç: 700+ testin hiçbiri değişiklik anında çalışmıyordu; regresyonlar ancak elle
# çalıştırıldığında görülüyordu.

on:
  push:
    # Aktif dallar dahil: kısa ömürlü konu dalları da kapsansın diye desen kullanılır.
    branches: [ main, master, production-hardening, "feature/**", "fix/**", "duzeltme/**" ]
    # ⚠️ YOL FILTRESI BILEREK YOK (monorepo 2026-08-18). Once `paths-ignore: [apps/ui/**,
    # pemf-vet-web/**]` eklendi, sonra GERI ALINDI: bu suit CAPRAZ-KATMAN kapilari iceriyor ve
    # onlar tam da OTEKI tarafin dosyalarini okuyor —
    #   · test_bayat_cihaz_gorunur.py  -> apps/ui/src/services/deviceRegistry.ts (STALE_MS)
    #   · test_site_paket_boyutlari.py -> pemf-vet-web/src/config.ts (indirme boyutlari)
    #   · test_version_visibility.py   -> pemf-vet-web/src/config.ts (APK surumu)
    # Filtre konulsaydi, YALNIZCA apps/ui/ ya da site degistiginde bu kapilar KOSMAZDI — yani
    # birlestirmenin asil kazanci (capraz-depo kapilarinin gercekten olcmesi) iptal olurdu.
    # Kritik-yol suiti ~3 dk ve public depoda UCRETSIZ; her degisiklikte kosmasi dogru takas.
  pull_request:
  # CT2 c: elle tetiklemede kip seçilebilir (boş = otomatik: dala / değişikliğe göre).
  workflow_dispatch:
    inputs:
      kip:
        description: "tam = tam süit + paket toplamı · otomatik = dala / değişikliğe göre (yayın dalı ve geniş etki → tam)"
        type: choice
        options: ["otomatik", "tam"]
        default: "otomatik"
  # CT2 c: gece tam koşusu (gece.yml) bu iş akışını `kip: tam` ile çağırır — iş adları "tam / …" olur, gerekli listeye GİRMEZ.
  workflow_call:
    inputs:
      kip:
        type: string
        default: "tam"

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

# Aynı dalda üst üste gelen push'larda eskisini iptal et (runner dakikası + hızlı geri bildirim).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # YGH: 25 dk 10-08'de (~790 test) kondu; süit bugün ~12 800 test (yerel CI-eşdeğeri seri 1 sa 51 dk). Paralelde bile 4 çekirdekli
    # koşucuda kapsamlı Windows adımı 25 dk'ya sığmaz → iş zaman aşımıyla düşerdi. Kapı: tests/test_ci_paralel_xdist_Y312.py (≥ 60).
    timeout-minutes: 120         # CT2: M sınıfı 201 test de koşuyor (CT1) — tam kip ~70–80 dk
    # YS1a (Y320, 26-11): windows-latest konsolu cp1252 — `scripts/ci_modelleri.py` Türkçe "ğ / ı" yazarken UnicodeEncodeError ile
    # çıkış 1 verdi, testler HİÇ koşmadı (YG1 4e). Betik de kendini UTF-8'e çevirir; bu ikinci katman diğer Türkçe yazan adımlar için.
    # Kapı: tests/test_ci_modelleri_konsol_kodlamasi_YS1.py.
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false          # bir platformun düşmesi diğerinin sonucunu gizlemesin
      matrix:
        # Y320: yalnız Windows (iş adı "backend (windows-latest)" aynen kalsın diye matris korunur). Kapı: test_ci_workflow_gate.py
        os: [windows-latest]
    steps:
      # YS1k: TAM geçmiş — site yasal metin mührünün geçmiş kolu (D6.33) mührün kaynak commit'ini git geçmişinde arar; sığ klonda
      # (varsayılan fetch-depth 1) "kardeş eser yok" diye ATLIYORDU. Kapı: test_ci_workflow_gate.py (…TAM_gecmis_YS1k).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          # CT2 b (Y326 katman 2): ürünün GÖNDERDİĞİ yama — sevk ağacı `python310.dll` 3.10.2 = gömülü derleme Python'u (ölçüldü 28-11).
          # "3.10" setup-python'da 3.10.11 kuruyordu (gh-101283 sınıfı davranış farkı). Kaynak: scripts/ci_sozlesmesi.json `urun_python`.
          # Kapı: tests/test_CT2b_ci_python_URUN_yamasi.py
          python-version: "3.10.2"
          cache: pip

      # CT2 c (Y326 katman 6): HIZLI küme mi TAM süit mi — `CI_KIP` (ve hızlı kipte ci_kume.txt) GITHUB_ENV'e. Kapı: test_CT2c_ci_hizli_kume_KIP.py
      - name: CI kipi (hızlı küme / tam süit)
        shell: bash
        run: python scripts/ci_hizli_kume.py kip --olay "${{ github.event_name }}" --dal "${{ github.ref_name }}" --istek "${{ inputs.kip }}" --github-env "$GITHUB_ENV"

      # SQLCipher: at-rest şifreleme / göç / karantina / kurtarma testleri GERÇEK kütüphaneyle koşsun.
      # ⚠️ A-46 (sahip kararı) + D2.07 (B-3.47): sqlcipher3 KURULAMAZSA İŞ KIRMIZI — sessiz düşüş YOK.
      # Eskiden Linux'ta kurulum `|| echo "... duz-metin yoluyla kosulacak"` ile YUTULUYOR, Windows'ta
      # HİÇ denenmiyordu ("wheel yok" varsayımı — oysa ürün Windows'ta sqlcipher3==0.6.2 tekerleğiyle
      # paketlenir, requirements.txt). Bu kapıların çoğu `importorskip`/`skipif` ile korunduğu için CI'da
      # ATLANIYOR ve iş YEŞİL bitiyordu. Her iki kurulum da bağlayıcıyı İÇE AKTARARAK doğrular; testten
      # sonra `sqlcipher atlama kapısı` adımı "sqlcipher" nedenli atlama sayısı > 0 ise işi düşürür.
      # 2-A inceleme (sahip isteği 2026-10-07): ürünün AYNI sabit tekerleği kurulur (requirements.txt ve requirements-test.txt ile
      # birebir). (Y320: Linux kurulum adımı Linux işiyle birlikte kalktı.)
      - name: SQLCipher kur (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary sqlcipher3 sqlcipher3==0.6.2
          python -c "from sqlcipher3 import dbapi2; print('sqlcipher3 hazir, SQLite', dbapi2.sqlite_version)"

      # YS1g (sahip 26-11: "başka eksik varsa CI'da kuralım hepsini … koşmamış hiç test olmamalı"): ÜRÜN ortamı = DERLEME KİLİDİ
      # (build_tools/myenv-requirements.txt, 237 sabit; scripts/bootstrap.ps1 ile AYNI komut: --no-deps + PyTorch CPU dizini), sonra
      # test eklentileri. Eskiden ağır AI hariçti → ~300 test "paket yok" diye ATLANIYOR, 114'ü kırmızıydı (0cf83c06).
      - name: Test bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r build_tools/myenv-requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt

      # YS1g: TypeScript isteyen pytest kapıları (i18n K-2 metin çıkarıcı `scripts/i18n/cikar_ts.cjs`, arayüz / site kaynak kapıları)
      # apps/ui ve apps/web node_modules'undaki derleyiciyi kullanır; yoksa ATLIYOR (16) ya da düşüyordu (K-2). Arayüz web dışa
      # aktarımı (`frontend/dist`, build_backend_exe.ps1 ile AYNI `npm run export:web`) paket / statik sunum kapılarının girdisi.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/web/package-lock.json
            dema-terapi-simülatörü/package-lock.json

      - name: Arayüz + site bağımlılıkları ve web dışa aktarımı (TypeScript kapıları)
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/ui && npm install --legacy-peer-deps --no-audit --no-fund)
          (cd apps/web && npm ci --no-audit --no-fund)
          (cd apps/ui && npm run export:web)
          rm -rf frontend/dist && mkdir -p frontend && cp -r apps/ui/dist frontend/dist
          test -f frontend/dist/index.html
          (cd "dema-terapi-simülatörü" && npm ci --no-audit --no-fund && npm run build)
          test -d "dema-terapi-simülatörü/dist"

      # ⚠️ D3.02 (B-10.48 · A-69): özel gitleaks kurallarını GERÇEK ikiliyle ölçen testler CI'da da koşsun. İkili
      # `.pre-commit-config.yaml`'daki SABİT rev'den (gitleaks v8.24.0) pre-commit ile kaynaktan kurulur (hazır ikili
      # indirilmez); testler onu `tests/gitleaks_ikili.py` ile pre-commit önbelleğinde bulur. pytest adımları
      # `PEMF_GITLEAKS_ZORUNLU=1` taşır: ikili bulunamazsa bu testler ATLANMAZ, DÜŞER (eskiden CI'da hep atlanıyordu).
      - name: gitleaks ikilisi (pre-commit, sabit rev)
        shell: bash
        run: |
          # CT1 (istem 66, ölçüldü 27-11 CI eşinde): kısıtsız kurulum derleme kilidindeki packaging 26.2 → 26.4 ve typing-extensions
          # 4.15.0 → 4.16.0 YÜKSELTİYORDU — testler ürün kilidinden farklı sürümlerle koşuyordu. Kilit KISIT (-c) olarak verilir.
          # Kapı: tests/test_CT1e_ci_ortami_KILITLE_ayni.py
          pip install "pre-commit>=4.0,<5.0" -c build_tools/myenv-requirements.txt
          pre-commit install-hooks

      # KP-5 E13 (sahip Y279 · Y282, 12-11): AI ağırlıkları / git-ignored test eserleri (ODAK alan tablosu + ONNX dahil) AÇIK DEPOYA
      # GİRMEZ — depo DIŞINDAKİ paketten GİZLİ ANAHTARLA indirilir, her dosya `scripts/ci_modelleri_listesi.json`daki SHA-256 ile
      # doğrulanır, model kökü `PEMF_AI_MODELS_DIR`e yazılır. "Eser yoksa atla" koruması YOK (KP-4 [SAHİBE] 4): indirme / doğrulama
      # düşerse iş KIRMIZI. Anahtar: depo Settings → Secrets → Actions → `PEMF_CI_MODEL_ANAHTARI`; kaynak listenin `kaynak.url`i
      # (ya da `PEMF_CI_MODEL_KAYNAGI` değişkeni). Paket: `python scripts/ci_modelleri.py paketle` (sahip, yerelde).
      # CT1 b / e (istem 66 · Y324): paket artık TAM ağırlık ağacı + PT ikizleri + test girdileri (~4,2 GB, 2 GiB sınırı yüzünden
      # PARÇALI — `PEMF_CI_MODEL_KAYNAGI` parça adreslerini boşlukla ayrılmış taşır). Parçalar önbellekte: anahtar = LİSTE özeti (liste
      # her dosyanın ve parçanın SHA-256'sını taşır → paket değişince anahtar değişir); `restore-keys` YOK (eski paket geri yüklenmez).
      # İndirme adımı önbellekteki parçaları SHA-256 ile doğrular, tutmazsa yeniden indirir. Kapı: test_CT1b_ci_modelleri_COK_PARCALI.py
      - name: AI model paketi önbelleği
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/pemf_ci_paket
          key: pemf-ci-modelleri-${{ hashFiles('scripts/ci_modelleri_listesi.json') }}

      - name: AI modelleri (gizli anahtarla indirme + SHA-256 doğrulama)
        shell: bash
        env:
          PEMF_CI_MODEL_ANAHTARI: ${{ secrets.PEMF_CI_MODEL_ANAHTARI }}
          PEMF_CI_MODEL_KAYNAGI: ${{ vars.PEMF_CI_MODEL_KAYNAGI }}
        # CT1 (ölçüldü 27-11, CI eşi): ağırlık ağacı DEPO İÇİ `release_assets/ai_models`'a açılır — yayın makinesinin (guii) düzeni;
        # 56 test bu yolu doğrudan okur (ör. test_yedek_kapsami büyük ağırlık karşıt-kanıtı) — RUNNER_TEMP'te ZORUNLU kipte KIRMIZIYDI.
        run: python scripts/ci_modelleri.py indir --hedef "$GITHUB_WORKSPACE/release_assets/ai_models" --onbellek "$RUNNER_TEMP/pemf_ci_paket" --github-env "$GITHUB_ENV"

      # YS1j → YS1l (tanı 21b5be65 · Windows Server 2025): koşucunun profil TEMP'inde doğan dosyaya `icacls /inheritance:r` kalıtımlı
      # ACE'leri SİLMİYOR, açık ACE'ye çeviriyor → "başka hesabın kilidi" (`/grant:r *S-1-5-19:(F)`) sonrası süreç hesabı (LA) erişimini
      # korur, dosya OKUNUR / dizin LİSTELENİR (19 kırmızı + 3 hata — UAC-süzgeçli belirteçle bile). D:\a\_temp'te aynı komut doğru.
      # Adım kilidi İŞLEVSEL ölçer; ölçülmüyorsa TEMP'i korumalı olağan profil biçimine getirir, yine olmazsa `$RUNNER_TEMP/pemf-tmp`'yi
      # hazırlayıp TEMP / TMP'yi oraya yönlendirir (GITHUB_ENV); hiçbiri ölçülmezse adım DÜŞER (süit boşuna koşmaz).
      # Kapı: tests/test_ci_temp_acl_YS1j.py.
      - name: Koşucu TEMP ACL'i (olağan profil biçimi)
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/ci_temp_acl.py

      # YS1k: kurucu kanca testleri (18K ACİL DURDUR, SYH2 / Y296 kaldırma, i18n başlatıcı, kaldırma yetim süreç — 17 test) `makensis`
      # ister; koşucuda NSIS YOK ("makensis yok" diye ATLIYORLARDI). Ürün kurucusunu derleyen Tauri CLI 2.11.4'ün sabitlediği dağıtım
      # (nsis-3.11.zip SHA1 ef7ff767… · nsis_tauri_utils v0.5.3 SHA1 75197fee… — ikili, yerel Tauri önbelleğiyle bayt bayt aynı) SHA-256
      # ile doğrulanır, Tauri düzeninde açılır; yol testlere `PEMF_MAKENSIS` ile verilir. Kapı: test_ci_workflow_gate.py (…NSIS_YS1k).
      - name: NSIS (Tauri kurucu derleyicisi, sabit özet)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          z="$RUNNER_TEMP/nsis-3.11.zip"; d="$RUNNER_TEMP/tauri/NSIS"; e="$d/Plugins/x86-unicode/additional"
          curl -fsSL --retry 3 -o "$z" https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip
          echo "c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1  $z" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tauri" && unzip -q "$z" -d "$RUNNER_TEMP/tauri" && mv "$RUNNER_TEMP/tauri/nsis-3.11" "$d"
          mkdir -p "$e"
          curl -fsSL --retry 3 -o "$e/nsis_tauri_utils.dll" https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll
          echo "5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709  $e/nsis_tauri_utils.dll" | sha256sum -c -
          "$d/makensis.exe" -VERSION
          echo "PEMF_MAKENSIS=$(cygpath -w "$d/makensis.exe")" >> "$GITHUB_ENV"

      # YS1m (c2d9476a koşusu: 12 637 / 0 kırmızı, kapsam %99,99 — `file_acl` 2 satır): Y96 paylaşılan grup ACE'i (`lock_down_file` /
      # `lock_down_dir`) bu makinede OLUŞTURULMUŞ bir yerel grup ister; koşucuda hiç yok. Grup ÜYELİKSİZ kurulur: üyelik belirtece
      # yalnız YENİ oturum açmada girer (barındırılan koşucuda hesap parolasına dokunulmaz) → üyelik isteyen 3 davranış testi yine
      # atlar (CI-ATLANAN, ORTAM); grup kolunu DACL'den ölçen test koşar. Kapı: test_ci_workflow_gate.py (…YEREL_GRUP_YS1m).
      - name: Paylaşılan yerel grup (Y96, üyeliksiz)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          net localgroup pemf-ci-paylasim *> $null
          if ($LASTEXITCODE -ne 0) { net localgroup pemf-ci-paylasim /add /comment:"PEMF CI Y96 grup kolu (uyeliksiz)"; if ($LASTEXITCODE -ne 0) { exit 1 } }
          net localgroup pemf-ci-paylasim
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ⚠️ Y30 / D4.10 (B-10.3): `-rs` her ATLAMAYI nedeniyle listeler — CI varsayılan kipte koşar ve kardeş kaynak
      # yoksa ≥193 test atlanır; nedenler görünmeden "yeşil" okunuyordu. Yayın öncesi ZORUNLU kip ayrı betikte:
      # scripts/yayin_oncesi_suit.ps1 (publish_release.ps1'in zorunlu adımı).
      # ⚠️ 4A-4.1 (4-A incelemesi): `-r<harfler>` pytest'in varsayılanı `fE`'nin YERİNE geçer — `-rs` tek başına kısa özetteki
      # FAILED/ERROR satırlarını siliyordu. `-rfEs`: kırmızılar ve atlama nedenleri birlikte.
      # ⚠️ Y312 · YGH (sahip 20-11 "CI paraleli de zincire"): adım PARALEL — `-n auto --dist loadgroup`. `loadgroup` ŞART:
      # tests/conftest.py zamanlayıcısı (tests/xdist_grup.py: dosya birimi + "seri" grubu tek işçide) yalnız loadgroup'ta devreye
      # girer; yalnız `-n` dosyaları işçilere BÖLER. pytest-cov işçi kapsamlarını birleştirir; junit'i denetleyici yazar (atlama kapısı
      # aynen okur). Kapı: tests/test_ci_paralel_xdist_Y312.py. (Y320: Linux pytest adımı Linux işiyle birlikte kalktı — YG1'in Linux
      # kırmızıları Linux uyumsuzluğuydu, paralel değil; YGH geri alması GEREKSİZ.)
      # ⚠️ KAPSAM RATCHET'İ YALNIZ WINDOWS'TA (2026-08-09 denetimi, Tier 3).
      # İki sebep: (a) ürün Windows'ta çalışır, (b) `fail_under` eşiği Windows'ta ölçüldü
      # (%54,24). Linux'ta DPAPI/ACL/serial gibi platforma özgü yollar hiç koşmadığı için aynı
      # eşik orada yanlış-kırmızı üretirdi. Eşik `pyproject.toml → [tool.coverage.report]`.
      # NOT: eşik ayarlıydı ama CI kapsamı HİÇ ÖLÇMÜYORDU — yani ratchet boş bir güvenceydi.
      # YS1i (3bec8be9 koşusu): koşucu (runneradmin) YÜKSELTİLMİŞ → ürünün kilidi Administrators'a tam yetki verdiği için ACL /
      # ikinci-hesap benzetimleri ölçülemedi (24 kırmızı + 3 hata, kapsam %99,98). Süit, ürünün ve geliştiricinin koştuğu gibi
      # UAC-SÜZGEÇLİ belirteçle koşar (scripts/ci_kisitli_belirtec.py: Administrators yalnız-ret, bütünlük orta). `shell: bash`:
      # pwsh 7 açılışta PSModulePath'e kendi yollarını ekleyip alt powershell.exe 5.1'e sızdırıyordu → Get-Acl yüklenemiyordu (5).
      - name: Kritik-yol testleri + kapsam ratcheti
        if: runner.os == 'Windows' && env.CI_KIP == 'tam'
        shell: bash
        env:
          PEMF_SIMULATE: ""
          PEMF_GITLEAKS_ZORUNLU: "1"
          PEMF_DEMA_DIST_ZORUNLU: "1"   # YS1g: DEMA dist yukarıda derlenir → o kapı ATLANAMAZ
          # CT1 b (istem 66): model paketi TAM → eser / ağırlık yokluğu ATLAMA değil KIRMIZI (Y sınıfı yayın makinesi eserleri
          # `capraz.atla(…, yalniz_yayin=True)` ile gerekçeli atlar — tests/ci_atlanan_defteri.json). Kapı: test_CT1b_ci_modelleri_COK_PARCALI.py
          PEMF_CAPRAZ_KAYNAK_ZORUNLU: "1"
        run: python scripts/ci_kisitli_belirtec.py pytest tests -n auto --dist loadgroup -v -rfEs --no-header --cov --cov-report=term --junitxml=pytest-junit.xml

      # CT2 c (Y326 katman 6): HIZLI küme — değişen test dosyaları + değişen dosyaların adını anan testler + sabit CI / i18n kapıları
      # (scripts/ci_hizli_kume.py; pytest `@dosya` argüman okuması). Alt kümede PAKET TOPLAMI anlamsız → `--cov-fail-under=0` YALNIZ
      # bu adımda (pyproject fail_under = 100 tam kipte AYNEN uygulanır: production-hardening push'u + gece); dalın değiştirdiği her
      # satırın testle koşması (fark kapsamı %100) aşağıdaki kapsam kilidinde BU kipte de zorunlu. Kapı: test_CT2c_ci_hizli_kume_KIP.py
      - name: Hızlı küme testleri (değişen alanlar — paket toplamı ölçülmez)
        if: runner.os == 'Windows' && env.CI_KIP == 'hizli'
        shell: bash
        env:
          PEMF_SIMULATE: ""
          PEMF_GITLEAKS_ZORUNLU: "1"
          PEMF_DEMA_DIST_ZORUNLU: "1"
          PEMF_CAPRAZ_KAYNAK_ZORUNLU: "1"
        run: python scripts/ci_kisitli_belirtec.py pytest @ci_kume.txt -n auto --dist loadgroup -v -rfEs --no-header --cov --cov-report=term --cov-fail-under=0 --junitxml=pytest-junit.xml

      # ⚠️ A-46 / D2.07: testler geçse bile "sqlcipher" nedenli ATLAMA varsa iş KIRMIZI. Kurulum adımı
      # bağlayıcıyı içe aktaramazsa iş zaten orada durur; bu adım kalan sessiz yolu kapatır (bağlayıcı
      # bir testte yüklenemedi / yeni bir test sqlcipher3'ü atlayarak eklendi). Çıkış 2 = junit yok/boş (kör).
      # YS1g: test başına sonuç (atlama NEDENİ dahil) junit eseri olarak saklanır — kırmızı / atlama listesi günlükten değil buradan
      # çıkarılır (CI-ATLANAN tablosu, istem 66). Kırmızı koşuda da yüklenir.
      - name: Test raporu (junit) eseri
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-junit-${{ matrix.os }}
          path: pytest-junit.xml
          retention-days: 30
          if-no-files-found: error

      # CT2 d (Y326 katman 7): junit özeti İŞ SAYFASINDA (geçen / kırmızı / atlanan + neden + defter sınıfı) — üçüncü parti eylem YOK.
      - name: Test raporu özeti (iş sayfası)
        if: always()
        shell: bash
        run: python scripts/ci_junit_ozet.py pytest-junit.xml --baslik "backend · ${{ env.CI_KIP }} kip" --cikti "$GITHUB_STEP_SUMMARY"

      - name: sqlcipher atlama kapısı (A-46)
        run: python scripts/ci_sqlcipher_atlama_kapisi.py pytest-junit.xml

      # CT1 c (istem 66 · Y324): SESSİZ ATLAMA BİTER — atlanan her test `tests/ci_atlanan_defteri.json`'da gerekçeli olmalı (yalnız Y =
      # yalnız yayın makinesi eseri, P = platform / ortam). Defterde olmayan atlama, M / D kaydı, model / eser nedenli kayıt ve koşuda
      # atlamayan (bayat) kayıt → KIRMIZI. Kapı: tests/test_CT1c_ci_atlanan_defteri_KAPI.py
      - name: Atlanan defteri kapısı (CT1 c)
        if: env.CI_KIP == 'tam'
        run: python scripts/ci_atlanan_kapisi.py pytest-junit.xml

      # CT2 c: hızlı kümede defterin her kaydı koşmaz → bayat kayıt denetimi YOK (`--kismi`); defterde OLMAYAN atlama yine KIRMIZI.
      - name: Atlanan defteri kapısı — hızlı küme (kısmi)
        if: env.CI_KIP == 'hizli'
        run: python scripts/ci_atlanan_kapisi.py pytest-junit.xml --kismi

      # CT1 f / g (istem 66 · Y311 / Y325 / Y326): KAPSAM KİLİDİ — (1) Python paketleri tabanın ALTINA inemez (sunucu %100 +
      # ai_hub tabanı, tests/kapsam_tabani.json; pyproject fail_under yalnız sunucuyu görür) · (2) dalın değiştirdiği ölçülen her
      # satır (sunucu + ai_hub) testle koşmuş olmalı — fark kapsamı %100 (taban: dalga-2, yoksa production-hardening).
      # Kapı: tests/test_CT1f_kapsam_tabani_KILIDI.py
      - name: Kapsam kilidi (taban + fark kapsamı)
        shell: bash
        # CT2 c: hızlı kipte paket toplamı ölçülmez (`--yalniz-json`: yalnız fark kapsamı girdisi yazılır); fark kapsamı HER kipte.
        run: |
          if [ "$CI_KIP" = tam ]; then python scripts/kapsam_tabani_kapisi.py --json coverage.json; else python scripts/kapsam_tabani_kapisi.py --json coverage.json --yalniz-json; fi
          python scripts/fark_kapsami.py --covjson coverage.json

      # CT2 d (katman 7): kapsam raporu ESER olarak (kırmızıda da) — satır satır ölçüm (coverage.json) + junit.
      - name: Kapsam raporu eseri
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: kapsam-backend-${{ env.CI_KIP }}
          path: coverage.json
          retention-days: 14
          if-no-files-found: warn

  sir-taramasi:
    name: sır taraması (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ⚠️ DENETİM 2026-08-09 (Tier 3): `.pre-commit-config.yaml` gitleaks hook'u TANIMLIYDU ama
    # `pre-commit install` HİÇ ÇALIŞTIRILMAMIŞTI (`.git/hooks` boştu) — yani kapı bir kez bile
    # açılmamıştı. Depo PUBLIC ve geçmişinde canlı sır bulunmuş bir depo (`config/credentials/*`,
    # `esp` dalı). Hook yalnız onu kuran kişiyi korur; CI işi HERKESİ korur — commit'i kimin
    # yaptığından bağımsız. Bu yüzden her ikisi de var.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0        # gitleaks GEÇMİŞİ de tarasın; yalnız son commit yetmez
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  launcher:
    name: launcher (cargo)
    runs-on: windows-latest      # üretim platformu; Windows'a özgü yollar burada derlenir
    timeout-minutes: 45          # Y243: + kapsam derlemesi (enstrümanlı) ve cargo-llvm-cov kurulumu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0        # CT1 f-3: fark kapsamı tabanı (birleşme tabanı) için tam geçmiş
      # CT2 c (katman 6): launcher/ (ya da fark kapsamı / taban / bu iş akışı) değişmediyse HIZLI kipte cargo adımları atlanır — iş yine
      # koşar ve yeşil biter (gerekli durum denetimi her push'ta yazılır); tam kipte (production-hardening / gece) her zaman koşar.
      - name: Alan (başlatıcı değişti mi?)
        shell: bash
        run: python scripts/ci_hizli_kume.py alan launcher --olay "${{ github.event_name }}" --dal "${{ github.ref_name }}" --istek "${{ inputs.kip }}" --github-env "$GITHUB_ENV"
      - name: Başlatıcı değişmedi — cargo adımları atlandı
        if: env.CI_ALAN != '1'
        shell: bash
        run: echo "launcher/ değişmedi (hızlı kip) — cargo test / kapsam / audit tam kipte ve gece koşar" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable dalı (launcher.yml ile aynı)
        if: env.CI_ALAN == '1'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        if: env.CI_ALAN == '1'
        with:
          workspaces: launcher
      # ⚠️ `--all-targets`: entegrasyon testleri (core/tests/real_artifacts.rs) da koşsun.
      # Onlar üretim manifest'ini okuyup şema/URL/platform değişmezlerini doğrular — yayın
      # hatalarını yakalayan asıl kapı orasıdır.
      - name: cargo test
        if: env.CI_ALAN == '1'
        working-directory: launcher
        run: cargo test --workspace --all-targets --locked
      # Y243 (KP-2 A5): başlatıcı satır kapsamı eşiği. Araç sürümü SABİT (cargo-llvm-cov 0.9.1, `--locked`); payda launcher/core/src +
      # launcher/app/src (entegrasyon testleri `tests/` hariç; bağımlılıklar aracın varsayılanıyla hariç). Eşik ölçülenin ~1 puan
      # altı (KP-1 / KP-2: satır %80,77) — yalnız YÜKSELTİLİR. KP-2 kapanış (2026-11-03): %82,16 (dosya içi #[cfg(test)]
      # modülleri paydada; ürün satırları %81,48 — KP-3 A2: burada %81,43 yazıyordu, kesin ölçüm %81,48) → 81. KP-3 AŞAMA 0
      # (2026-11-07, d45d9cf2): %82,04 (bu adımın ölçüsü — llvm toplam).
      # KP-3 AŞAMA D (2026-11-08, uç 6c7d4f10): %83,75 (aynı ölçü) → 82.
      # KP-4 A1 (Y257 c, sahip 08.11): `launcher/app/src/kabuk.rs` (S sınıfı Tauri kabuğu — pencere / WebView / gerçek platform; 44 işlev
      # → KP-5 B2 52: A2c'nin 8 ince kök kabuğu, gövdeleri `_ile` ölçülür),
      # `launcher/app/kapsam_siniflari.json`) ölçümden GEREKÇELİ dışlanır → bu adım "ürün ölçüsü"dür (S hariç). Dışlamanın dürüstlüğü:
      # `tests/test_KP3_main_rs_kapsam_siniflari.py` (S yalnız kabuk.rs'te, orada S dışı işlev / test yok, desen başka dosya yakalamaz).
      # KP-4 C (2026-11-11, uç da182963 — launcher o günden beri değişmedi): İKİ ölçü — llvm toplam (KP-3 ile karşılaştırılabilir)
      # %86,99 (13 693 satır, 1 782 eksik) · ÜRÜN ölçüsü (bu adım; + kabuk.rs hariç) %90,26 (13 150 satır, 1 281 eksik) → 82 → 89.
      # KP-5 F (2026-11-14, uç a5ba8313 — B1–B4 sonrası; launcher o günden beri değişmedi): llvm toplam %88,14 (14 414 satır,
      # 1 709 eksik) · ÜRÜN ölçüsü (bu adım) %91,47 (13 864 satır, 1 183 eksik) → 89 → 90.
      # KP-6 F (2026-11-16, madde 6 — 10 komut gövdesi `KomutOrtami` ile testli): llvm toplam %90,90 (15 695 satır, 1 428 eksik) · ÜRÜN ölçüsü (bu adım) %95,36 (14 936 satır, 693 eksik) → 90 → 94.
      # KP-8 D (2026-11-17, KP-7 A auth / söküm + KP-8 A1 indirme / denetim testleri): ÜRÜN ölçüsü %96,04 (15 353 satır, 608 eksik) → 94 → 95.
      - name: llvm-tools (kapsam)
        if: env.CI_ALAN == '1'
        run: rustup component add llvm-tools-preview
      - name: cargo-llvm-cov kur (sabit sürüm)
        if: env.CI_ALAN == '1'
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: cargo llvm-cov (satır kapsamı eşiği)
        if: env.CI_ALAN == '1'
        working-directory: launcher
        # CT1 f-2 (istem 66 · Y325): eşik = TABAN − ÖLÇÜLMÜŞ oynama payı (tests/kapsam_tabani.json → baslatici_cargo.ci_esigi;
        # tutarlılık: tests/test_CT1f_kapsam_tabani_KILIDI.py) · lcov → fark kapsamı kapısı (aşağıda).
        run: cargo llvm-cov --workspace --all-targets --locked --ignore-filename-regex "[\\/]tests[\\/]|[\\/]app[\\/]src[\\/]kabuk\.rs" --fail-under-lines 96.03 --lcov --output-path lcov.info
      # CT3 (istem 66 · katman 7): ilk GitHub koşusu (@ 6d1ebb75) bu eşikte düştü ama `--lcov` kipi ölçülen değeri BASMIYORDU ve lcov
      # eser değildi → hangi dosya / satır eksik görülemiyordu. lcov (eşik adımının KENDİ çıktısı — dışlama deseni tek yerde kalır,
      # tests/test_KP3_main_rs_kapsam_siniflari.py) kırmızıda da eser. Kapı: tests/test_CT3a_kapsam_eseri_BASLATICI_ISTEMCI.py
      - name: Başlatıcı kapsam raporu eseri (kırmızıda da)
        if: (success() || failure()) && env.CI_ALAN == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: baslatici-lcov
          path: launcher/lcov.info
          if-no-files-found: warn
      # CT1 f-3 (istem 66 · Y311 / Y325): dalın değiştirdiği her ölçülen başlatıcı satırı testle koşmuş olmalı (fark kapsamı %100).
      - name: Fark kapsamı kapısı (başlatıcı)
        if: env.CI_ALAN == '1'
        shell: bash
        run: python scripts/fark_kapsami.py --lcov launcher/lcov.info:launcher
      # D3.15 (B-8.18): bağımlılık güvenlik denetimi HER PUSH'ta (eskiden yalnız `launcher-v*` etiketinde — yani yayından SONRA).
      # `launcher/.cargo/audit.toml`'daki gerekçeli yoksayma listesi okunur (çalışma dizini launcher) — onsuz 7 bakımsız uyarı
      # hattı hep kırmızı yapardı; listede olmayan her yeni açık / uyarı kırar. Yoksayma listesine gerçek açık EKLENMEZ.
      - name: cargo audit (bağımlılık güvenlik denetimi)
        if: env.CI_ALAN == '1'
        working-directory: launcher
        run: |
          cargo install cargo-audit --locked --version ^0.22
          cargo audit --deny warnings

  # CT2 f / f2 (Y326 katman 9 · Y344-1): KART YAZILIMI CI — (1) STM32 derlemesi HER push'ta resmî Arm GNU Toolchain 12.3.rel1 ile (STM32CubeIDE
  # 1.17'nin "GNU Tools for STM32 12.3.rel1"i ile AYNI GCC 12.3.1 20230626; sürüm + SHA-256 sabit), boyut iş özetine · (2) bilgisayar koşum
  # takımı testleri (ISR + ana döngü: ACİL DURDUR, komut ayrıştırma, bekçi, pemf_sensor.c / pemf_akim.c) winlibs GCC + gcov ile → kart
  # yazılımı kapsam TABANI (tests/kapsam_tabani.json) + fark kapsamı %100. İkili SHA ↔ manifest tutarlılığı istem 64 OF1'in işi (Y322) —
  # burada KURULMAZ (scripts/ci_sozlesmesi.json `on_denetim`). Kapı: tests/test_CT2f_firmware_CI_isi.py
  firmware:
    name: firmware (STM32 + bilgisayar)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0        # fark kapsamı tabanı (birleşme tabanı) için tam geçmiş
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10.2"   # CT2 b: ürün yaması (scripts/ci_sozlesmesi.json urun_python)
          cache: pip
      - name: Alan (kart yazılımı değişti mi?)
        shell: bash
        run: python scripts/ci_hizli_kume.py alan firmware --olay "${{ github.event_name }}" --dal "${{ github.ref_name }}" --istek "${{ inputs.kip }}" --github-env "$GITHUB_ENV"
      - name: Arm GNU araç zinciri (12.3.rel1, sabit özet)
        shell: bash
        run: |
          set -euo pipefail
          z="$RUNNER_TEMP/arm-gnu-12.3.rel1.zip"; d="$RUNNER_TEMP/arm"
          curl -fsSL --retry 3 -o "$z" https://developer.arm.com/-/media/Files/downloads/gnu/12.3.rel1/binrel/arm-gnu-toolchain-12.3.rel1-mingw-w64-i686-arm-none-eabi.zip
          echo "d52888bf59c5262ebf3e6b19b9f9e6270ecb60fd218cf81a4e793946e805a654  $z" | sha256sum -c -
          mkdir -p "$d" && unzip -q -o "$z" -d "$d"
          b="$d/arm-gnu-toolchain-12.3.rel1-mingw-w64-i686-arm-none-eabi/bin"
          "$b/arm-none-eabi-gcc.exe" --version
          cygpath -w "$b" >> "$GITHUB_PATH"
      - name: STM32 derlemesi (arm-none-eabi-gcc)
        shell: bash
        run: python scripts/firmware_derle.py --stm --cikti "$RUNNER_TEMP/fw_cikti"
      - name: Kart ikilisi boyutu (iş özeti)
        shell: bash
        run: python scripts/ci_junit_ozet.py --fw-boyut "$RUNNER_TEMP/fw_cikti" --cikti "$GITHUB_STEP_SUMMARY"
      - name: winlibs GCC (bilgisayar koşum takımı + gcov, sabit özet)
        if: env.CI_ALAN == '1'
        shell: bash
        run: |
          set -euo pipefail
          z="$RUNNER_TEMP/winlibs-gcc-16.2.0.zip"
          curl -fsSL --retry 3 -o "$z" https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.zip
          echo "3c69305081e4a647144339a936244fcf7d3d9e558319e1ad7be2cd2886d4b6a1  $z" | sha256sum -c -
          unzip -q -o "$z" -d "$RUNNER_TEMP/winlibs"
          b="$RUNNER_TEMP/winlibs/mingw64/bin"
          "$b/gcc.exe" --version
          cygpath -w "$b" >> "$GITHUB_PATH"
          echo "PEMF_CC=$(cygpath -w "$b/gcc.exe")" >> "$GITHUB_ENV"
          echo "PEMF_GCOV=$(cygpath -w "$b/gcov.exe")" >> "$GITHUB_ENV"
      - name: Test bağımlılıkları (koşum takımı testleri — ürün kilidi)
        if: env.CI_ALAN == '1'
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r build_tools/myenv-requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt
      - name: Kart yazılımı bilgisayar testleri (gcc + gcov)
        if: env.CI_ALAN == '1'
        shell: bash
        env:
          PEMF_SIMULATE: ""
          PEMF_FW_KAPSAM: "1"
        run: python scripts/ci_hizli_kume.py firmware-testleri --kume-dosyasi fw_testleri.txt && python -m pytest @fw_testleri.txt -n auto --dist loadgroup -rfEs --no-header -p no:cacheprovider --basetemp="$RUNNER_TEMP/fwtmp" --junitxml=firmware-junit.xml
      - name: Kart yazılımı kapsamı (taban + fark kapsamı)
        if: env.CI_ALAN == '1'
        shell: bash
        run: |
          python scripts/firmware_kapsam.py --kok "$RUNNER_TEMP/fwtmp" --gcov "$PEMF_GCOV" --lcov firmware.info --taban tests/kapsam_tabani.json
          python scripts/fark_kapsami.py --lcov firmware.info:.
      - name: Kart yazılımı raporu eseri
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: firmware-rapor
          path: |
            firmware-junit.xml
            firmware.info
          retention-days: 14
          if-no-files-found: warn

  # CT2 d (Y326 katman 7): DAL / COMMIT BAŞINA TEK ÖZET — bu iş akışının bütün işlerinin sonucu tek tabloda (kırmızıda hangi iş, nereye
  # bakılır). Gerekli liste DIŞINDA (kendisi bir toplama; gerekli işler scripts/ci_sozlesmesi.json).
  ozet:
    name: CI özeti
    needs: [backend, sir-taramasi, launcher, firmware]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: İş sonuçları (tek tablo)
        env:
          SONUCLAR: ${{ toJSON(needs) }}
          DAL: ${{ github.ref_name }}
          KOSU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci_junit_ozet.py --isler-env SONUCLAR --cikti "$GITHUB_STEP_SUMMARY"

  # ⚠️ KALDIRILDI (2026-08-12): `arayüz (tsc + jest)` ve `site (build)` işleri.
  #
  # Bu iki iş BU DEPODA HİÇBİR ZAMAN ÇALIŞAMAZDI ve hattın 16 çalışmasının 16'sının da
  # kırmızı olmasının sebeplerindendi:
  #   * `apps/ui/` (o zamanki adıyla `pf/`, Expo mobil) ve `apps/web/` (o zaman `pemf-vet-web/`; kendi git deposu + kendi Vercel projesi)
  #     `.gitignore` ile BİLEREK dışlanmıştır — `git ls-files` ikisinde de **0 dosya** döner.
  #   * Dolayısıyla `checkout` sonrası o dizinler YOKTUR; `setup-node` daha `cache-dependency-path`
  #     çözemeden ("Some specified paths were not resolved") iş düşerdi.
  #
  # Sürekli kırmızı bir hat SİNYAL DEĞERİNİ KAYBEDER: gerçekten bir şey bozulduğunda kimse
  # fark etmez ve her push'ta gereksiz "Run failed" postası gider. Çalışamayacak bir işi
  # tutmaktansa kaldırmak dürüsttür.
  #
  # Bu kontroller KAYBOLMADI, yeri değişti:
  #   * `pemf-vet-web` → kendi deposunda (`npx tsc --noEmit` + `npm run build` + vitest;
  #     yayın zaten `npx vercel --prod` ile oradan yapılıyor).
  #   * `apps/ui` (mobil)   → kendi Expo projesinde; APK yayını `build_tools/build_apk.ps1` ile.
  # İkisine CI kurulacaksa AYRI depolarında kurulmalı, burada değil.
  #
  # ── GEÇERSİZ (2026-08-18, tek depoya geçildi) ────────────────────────────────
  # Yukarıdaki gerekçenin DAYANAĞI ortadan kalktı: `apps/ui/` ve `apps/web/` artık .gitignore'da
  # DEĞİL, bu deponun içinde izleniyor (`git ls-files apps/ui` → 218, `apps/web` → 83 dosya).
  # Dolayısıyla "checkout sonrası o dizinler YOKTUR" cümlesi ARTIK DOĞRU DEĞİL.
  # Son cümle de ("AYRI depolarında kurulmalı, burada değil") tersine döndü — iki iş de bu
  # depoda, KÖK `.github/workflows/` altında kuruldu ve yeşil koşuyor:
  #   * `.github/workflows/frontend.yml` → apps/ui (tsc + jest-expo)
  #   * `.github/workflows/site.yml`     → apps/web (check:legal + oxlint + tsc + vitest + build)
  # Blok, kaldırma kararının NEDENİNİ kayıtta tutmak için duruyor; talimat olarak okumayın.
