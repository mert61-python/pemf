name: critical-path-tests

# PEMF backend kritik-yol testleri (32): emergency_stop, çift-session 409, coil transport
# STM/ESP yönlendirme, PII maskeleme + fail-closed şifreleme, rate-limit, seans/DB kalıcılık,
# auth zorlama/muafiyet. Bağımlılıklar TEK dosyada: requirements-test.txt (ağır AI'lar lazy →
# kurulmaz; sqlcipher3 hariç → kod düz-metine graceful düşer). Temiz venv'de yeşil doğrulandı.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run critical-path tests
        env:
          PEMF_SIMULATE: ""
        run: pytest tests -v --no-header --cov --cov-report=term-missing
