name: critical-path-tests

# PEMF kritik-yol testleri — backend (pytest, Linux+Windows) + launcher (cargo) + sır taraması.
# (Arayüz/site işleri için dosyanın SONUNDAKİ "KALDIRILDI (2026-08-12)" notuna bakınız.)
#
# ⚠️ DENETİM 2026-08-09 (Tier 1) — CI GERÇEKTEN AÇILDI. Önceki hâlinde:
#   • tetikleyici yalnız `main, master` idi; geliştirme AKTİF DALDA (production-hardening)
#     yapıldığı için iş akışı sahadaki hiçbir değişiklikte KOŞMUYORDU,
#   • yalnız `ubuntu-latest` vardı; oysa ÜRÜN WINDOWS'ta çalışıyor ve launcher/ProgramData/
#     DPAPI/güvenlik-duvarı yollarının tamamı Windows'a özgü — hiç test edilmiyordu,
#   • `cargo test` yalnız `launcher-v*` TAG'inde koşuyordu (yani yayından SONRA),
#   • arayüz için `tsc --noEmit` ve `jest` HİÇ koşmuyordu.
# Sonuç: 700+ testin hiçbiri değişiklik anında çalışmıyordu; regresyonlar ancak elle
# çalıştırıldığında görülüyordu.

on:
  push:
    # Aktif dallar dahil: kısa ömürlü konu dalları da kapsansın diye desen kullanılır.
    branches: [ main, master, production-hardening, "feature/**", "fix/**" ]
    # ⚠️ YOL FILTRESI BILEREK YOK (monorepo 2026-08-18). Once `paths-ignore: [pf/**,
    # pemf-vet-web/**]` eklendi, sonra GERI ALINDI: bu suit CAPRAZ-KATMAN kapilari iceriyor ve
    # onlar tam da OTEKI tarafin dosyalarini okuyor —
    #   · test_bayat_cihaz_gorunur.py  -> pf/src/services/deviceRegistry.ts (STALE_MS)
    #   · test_site_paket_boyutlari.py -> pemf-vet-web/src/config.ts (indirme boyutlari)
    #   · test_version_visibility.py   -> pemf-vet-web/src/config.ts (APK surumu)
    # Filtre konulsaydi, YALNIZCA pf/ ya da site degistiginde bu kapilar KOSMAZDI — yani
    # birlestirmenin asil kazanci (capraz-depo kapilarinin gercekten olcmesi) iptal olurdu.
    # Kritik-yol suiti ~3 dk ve public depoda UCRETSIZ; her degisiklikte kosmasi dogru takas.
  pull_request:
  workflow_dispatch:

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

# Aynı dalda üst üste gelen push'larda eskisini iptal et (runner dakikası + hızlı geri bildirim).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false          # bir platformun düşmesi diğerinin sonucunu gizlemesin
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # SQLCipher: at-rest şifreleme testleri gerçek kütüphaneyle koşsun. Kurulmazsa kod
      # düz-metne graceful düşer ve şifreleme yolları SESSİZCE test edilmemiş olur.
      # (Windows'ta sqlcipher3 wheel'i yok → orada düz-metin yoluyla koşulur; iki platformun
      # farkı bilinçlidir ve `test_at_rest_encryption` bunu zaten iki durumda da sınar.)
      - name: SQLCipher kur (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev
          python -m pip install --upgrade pip
          pip install sqlcipher3-binary || pip install sqlcipher3 || echo "sqlcipher3 kurulamadi — duz-metin yoluyla kosulacak"

      - name: Test bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Kritik-yol testleri
        if: runner.os != 'Windows'
        env:
          PEMF_SIMULATE: ""
        run: pytest tests -v --no-header

      # ⚠️ KAPSAM RATCHET'İ YALNIZ WINDOWS'TA (2026-08-09 denetimi, Tier 3).
      # İki sebep: (a) ürün Windows'ta çalışır, (b) `fail_under` eşiği Windows'ta ölçüldü
      # (%54,24). Linux'ta DPAPI/ACL/serial gibi platforma özgü yollar hiç koşmadığı için aynı
      # eşik orada yanlış-kırmızı üretirdi. Eşik `pyproject.toml → [tool.coverage.report]`.
      # NOT: eşik ayarlıydı ama CI kapsamı HİÇ ÖLÇMÜYORDU — yani ratchet boş bir güvenceydi.
      - name: Kritik-yol testleri + kapsam ratcheti
        if: runner.os == 'Windows'
        env:
          PEMF_SIMULATE: ""
        run: pytest tests -v --no-header --cov --cov-report=term

  sir-taramasi:
    name: sır taraması (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ⚠️ DENETİM 2026-08-09 (Tier 3): `.pre-commit-config.yaml` gitleaks hook'u TANIMLIYDU ama
    # `pre-commit install` HİÇ ÇALIŞTIRILMAMIŞTI (`.git/hooks` boştu) — yani kapı bir kez bile
    # açılmamıştı. Depo PUBLIC ve geçmişinde canlı sır bulunmuş bir depo (`config/credentials/*`,
    # `esp` dalı). Hook yalnız onu kuran kişiyi korur; CI işi HERKESİ korur — commit'i kimin
    # yaptığından bağımsız. Bu yüzden her ikisi de var.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks GEÇMİŞİ de tarasın; yalnız son commit yetmez
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  launcher:
    name: launcher (cargo)
    runs-on: windows-latest      # üretim platformu; Windows'a özgü yollar burada derlenir
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      # ⚠️ `--all-targets`: entegrasyon testleri (core/tests/real_artifacts.rs) da koşsun.
      # Onlar üretim manifest'ini okuyup şema/URL/platform değişmezlerini doğrular — yayın
      # hatalarını yakalayan asıl kapı orasıdır.
      - name: cargo test
        working-directory: launcher
        run: cargo test --workspace --all-targets --locked

  # ⚠️ KALDIRILDI (2026-08-12): `arayüz (tsc + jest)` ve `site (build)` işleri.
  #
  # Bu iki iş BU DEPODA HİÇBİR ZAMAN ÇALIŞAMAZDI ve hattın 16 çalışmasının 16'sının da
  # kırmızı olmasının sebeplerindendi:
  #   * `pf/` (Expo mobil) ve `pemf-vet-web/` (kendi git deposu + kendi Vercel projesi)
  #     `.gitignore` ile BİLEREK dışlanmıştır — `git ls-files` ikisinde de **0 dosya** döner.
  #   * Dolayısıyla `checkout` sonrası o dizinler YOKTUR; `setup-node` daha `cache-dependency-path`
  #     çözemeden ("Some specified paths were not resolved") iş düşerdi.
  #
  # Sürekli kırmızı bir hat SİNYAL DEĞERİNİ KAYBEDER: gerçekten bir şey bozulduğunda kimse
  # fark etmez ve her push'ta gereksiz "Run failed" postası gider. Çalışamayacak bir işi
  # tutmaktansa kaldırmak dürüsttür.
  #
  # Bu kontroller KAYBOLMADI, yeri değişti:
  #   * `pemf-vet-web` → kendi deposunda (`npx tsc --noEmit` + `npm run build` + vitest;
  #     yayın zaten `npx vercel --prod` ile oradan yapılıyor).
  #   * `pf` (mobil)   → kendi Expo projesinde; APK yayını `build_tools/build_apk.ps1` ile.
  # İkisine CI kurulacaksa AYRI depolarında kurulmalı, burada değil.
