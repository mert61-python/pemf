name: critical-path-tests

# PEMF backend kritik-yol testleri: emergency_stop, çift-session 409, FGS no-detection,
# patient field-encryption + cross-tenant maskeleme, treatment retention/at-rest görünürlük.
# NOT: depo henüz git'te değil — git init + GitHub push sonrası otomatik çalışır.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          # Import-zamanı runtime bağımlılıkları (torch/ultralytics testlerde lazy → kurulmaz)
          pip install fastapi "uvicorn" pydantic cryptography numpy opencv-python-headless paho-mqtt
          pip install -r requirements-test.txt

      - name: Run critical-path tests
        env:
          PEMF_SIMULATE: ""
        run: pytest tests -v --no-header
