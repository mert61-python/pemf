name: critical-path-tests

# PEMF kritik-yol testleri — backend (pytest, Windows) + launcher (cargo) + sır taraması.
# YS1b · Y320 (sahip 25-11): CI YALNIZ Windows ürün hattı — backend `ubuntu-latest` kopyası ve Linux / macOS paketleme iş akışları
# (`linux-backend.yml`, `mac-backend.yml`) kaldırıldı (git geçmişinde). lint / security / site / frontend Ubuntu koşucuda kalır
# (ürün platformu değil, yalnız CI makinesi).
# (Arayüz/site işleri için dosyanın SONUNDAKİ "KALDIRILDI (2026-08-12)" notuna bakınız.)
#
# ⚠️ DENETİM 2026-08-09 (Tier 1) — CI GERÇEKTEN AÇILDI. Önceki hâlinde:
#   • tetikleyici yalnız `main, master` idi; geliştirme AKTİF DALDA (production-hardening)
#     yapıldığı için iş akışı sahadaki hiçbir değişiklikte KOŞMUYORDU,
#   • yalnız `ubuntu-latest` vardı; oysa ÜRÜN WINDOWS'ta çalışıyor ve launcher/ProgramData/
#     DPAPI/güvenlik-duvarı yollarının tamamı Windows'a özgü — hiç test edilmiyordu,
#   • `cargo test` yalnız `launcher-v*` TAG'inde koşuyordu (yani yayından SONRA),
#   • arayüz için `tsc --noEmit` ve `jest` HİÇ koşmuyordu.
# Sonuç: 700+ testin hiçbiri değişiklik anında çalışmıyordu; regresyonlar ancak elle
# çalıştırıldığında görülüyordu.

on:
  push:
    # Aktif dallar dahil: kısa ömürlü konu dalları da kapsansın diye desen kullanılır.
    branches: [ main, master, production-hardening, "feature/**", "fix/**", "duzeltme/**" ]
    # ⚠️ YOL FILTRESI BILEREK YOK (monorepo 2026-08-18). Once `paths-ignore: [apps/ui/**,
    # pemf-vet-web/**]` eklendi, sonra GERI ALINDI: bu suit CAPRAZ-KATMAN kapilari iceriyor ve
    # onlar tam da OTEKI tarafin dosyalarini okuyor —
    #   · test_bayat_cihaz_gorunur.py  -> apps/ui/src/services/deviceRegistry.ts (STALE_MS)
    #   · test_site_paket_boyutlari.py -> pemf-vet-web/src/config.ts (indirme boyutlari)
    #   · test_version_visibility.py   -> pemf-vet-web/src/config.ts (APK surumu)
    # Filtre konulsaydi, YALNIZCA apps/ui/ ya da site degistiginde bu kapilar KOSMAZDI — yani
    # birlestirmenin asil kazanci (capraz-depo kapilarinin gercekten olcmesi) iptal olurdu.
    # Kritik-yol suiti ~3 dk ve public depoda UCRETSIZ; her degisiklikte kosmasi dogru takas.
  pull_request:
  workflow_dispatch:

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

# Aynı dalda üst üste gelen push'larda eskisini iptal et (runner dakikası + hızlı geri bildirim).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # YGH: 25 dk 10-08'de (~790 test) kondu; süit bugün ~12 800 test (yerel CI-eşdeğeri seri 1 sa 51 dk). Paralelde bile 4 çekirdekli
    # koşucuda kapsamlı Windows adımı 25 dk'ya sığmaz → iş zaman aşımıyla düşerdi. Kapı: tests/test_ci_paralel_xdist_Y312.py (≥ 60).
    timeout-minutes: 90
    # YS1a (Y320, 26-11): windows-latest konsolu cp1252 — `scripts/ci_modelleri.py` Türkçe "ğ / ı" yazarken UnicodeEncodeError ile
    # çıkış 1 verdi, testler HİÇ koşmadı (YG1 4e). Betik de kendini UTF-8'e çevirir; bu ikinci katman diğer Türkçe yazan adımlar için.
    # Kapı: tests/test_ci_modelleri_konsol_kodlamasi_YS1.py.
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false          # bir platformun düşmesi diğerinin sonucunu gizlemesin
      matrix:
        # Y320: yalnız Windows (iş adı "backend (windows-latest)" aynen kalsın diye matris korunur). Kapı: test_ci_workflow_gate.py
        os: [windows-latest]
    steps:
      # YS1k: TAM geçmiş — site yasal metin mührünün geçmiş kolu (D6.33) mührün kaynak commit'ini git geçmişinde arar; sığ klonda
      # (varsayılan fetch-depth 1) "kardeş eser yok" diye ATLIYORDU. Kapı: test_ci_workflow_gate.py (…TAM_gecmis_YS1k).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # SQLCipher: at-rest şifreleme / göç / karantina / kurtarma testleri GERÇEK kütüphaneyle koşsun.
      # ⚠️ A-46 (sahip kararı) + D2.07 (B-3.47): sqlcipher3 KURULAMAZSA İŞ KIRMIZI — sessiz düşüş YOK.
      # Eskiden Linux'ta kurulum `|| echo "... duz-metin yoluyla kosulacak"` ile YUTULUYOR, Windows'ta
      # HİÇ denenmiyordu ("wheel yok" varsayımı — oysa ürün Windows'ta sqlcipher3==0.6.2 tekerleğiyle
      # paketlenir, requirements.txt). Bu kapıların çoğu `importorskip`/`skipif` ile korunduğu için CI'da
      # ATLANIYOR ve iş YEŞİL bitiyordu. Her iki kurulum da bağlayıcıyı İÇE AKTARARAK doğrular; testten
      # sonra `sqlcipher atlama kapısı` adımı "sqlcipher" nedenli atlama sayısı > 0 ise işi düşürür.
      # 2-A inceleme (sahip isteği 2026-10-07): ürünün AYNI sabit tekerleği kurulur (requirements.txt ve requirements-test.txt ile
      # birebir). (Y320: Linux kurulum adımı Linux işiyle birlikte kalktı.)
      - name: SQLCipher kur (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary sqlcipher3 sqlcipher3==0.6.2
          python -c "from sqlcipher3 import dbapi2; print('sqlcipher3 hazir, SQLite', dbapi2.sqlite_version)"

      # YS1g (sahip 26-11: "başka eksik varsa CI'da kuralım hepsini … koşmamış hiç test olmamalı"): ÜRÜN ortamı = DERLEME KİLİDİ
      # (build_tools/myenv-requirements.txt, 237 sabit; scripts/bootstrap.ps1 ile AYNI komut: --no-deps + PyTorch CPU dizini), sonra
      # test eklentileri. Eskiden ağır AI hariçti → ~300 test "paket yok" diye ATLANIYOR, 114'ü kırmızıydı (0cf83c06).
      - name: Test bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r build_tools/myenv-requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt

      # YS1g: TypeScript isteyen pytest kapıları (i18n K-2 metin çıkarıcı `scripts/i18n/cikar_ts.cjs`, arayüz / site kaynak kapıları)
      # apps/ui ve apps/web node_modules'undaki derleyiciyi kullanır; yoksa ATLIYOR (16) ya da düşüyordu (K-2). Arayüz web dışa
      # aktarımı (`frontend/dist`, build_backend_exe.ps1 ile AYNI `npm run export:web`) paket / statik sunum kapılarının girdisi.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/web/package-lock.json
            dema-terapi-simülatörü/package-lock.json

      - name: Arayüz + site bağımlılıkları ve web dışa aktarımı (TypeScript kapıları)
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/ui && npm install --legacy-peer-deps --no-audit --no-fund)
          (cd apps/web && npm ci --no-audit --no-fund)
          (cd apps/ui && npm run export:web)
          rm -rf frontend/dist && mkdir -p frontend && cp -r apps/ui/dist frontend/dist
          test -f frontend/dist/index.html
          (cd "dema-terapi-simülatörü" && npm ci --no-audit --no-fund && npm run build)
          test -d "dema-terapi-simülatörü/dist"

      # ⚠️ D3.02 (B-10.48 · A-69): özel gitleaks kurallarını GERÇEK ikiliyle ölçen testler CI'da da koşsun. İkili
      # `.pre-commit-config.yaml`'daki SABİT rev'den (gitleaks v8.24.0) pre-commit ile kaynaktan kurulur (hazır ikili
      # indirilmez); testler onu `tests/gitleaks_ikili.py` ile pre-commit önbelleğinde bulur. pytest adımları
      # `PEMF_GITLEAKS_ZORUNLU=1` taşır: ikili bulunamazsa bu testler ATLANMAZ, DÜŞER (eskiden CI'da hep atlanıyordu).
      - name: gitleaks ikilisi (pre-commit, sabit rev)
        shell: bash
        run: |
          pip install "pre-commit>=4.0,<5.0"
          pre-commit install-hooks

      # KP-5 E13 (sahip Y279 · Y282, 12-11): AI ağırlıkları / git-ignored test eserleri (ODAK alan tablosu + ONNX dahil) AÇIK DEPOYA
      # GİRMEZ — depo DIŞINDAKİ paketten GİZLİ ANAHTARLA indirilir, her dosya `scripts/ci_modelleri_listesi.json`daki SHA-256 ile
      # doğrulanır, model kökü `PEMF_AI_MODELS_DIR`e yazılır. "Eser yoksa atla" koruması YOK (KP-4 [SAHİBE] 4): indirme / doğrulama
      # düşerse iş KIRMIZI. Anahtar: depo Settings → Secrets → Actions → `PEMF_CI_MODEL_ANAHTARI`; kaynak listenin `kaynak.url`i
      # (ya da `PEMF_CI_MODEL_KAYNAGI` değişkeni). Paket: `python scripts/ci_modelleri.py paketle` (sahip, yerelde).
      - name: AI modelleri (gizli anahtarla indirme + SHA-256 doğrulama)
        shell: bash
        env:
          PEMF_CI_MODEL_ANAHTARI: ${{ secrets.PEMF_CI_MODEL_ANAHTARI }}
          PEMF_CI_MODEL_KAYNAGI: ${{ vars.PEMF_CI_MODEL_KAYNAGI }}
        run: python scripts/ci_modelleri.py indir --hedef "$RUNNER_TEMP/pemf_ai_models" --github-env "$GITHUB_ENV"

      # YS1j → YS1l (tanı 21b5be65 · Windows Server 2025): koşucunun profil TEMP'inde doğan dosyaya `icacls /inheritance:r` kalıtımlı
      # ACE'leri SİLMİYOR, açık ACE'ye çeviriyor → "başka hesabın kilidi" (`/grant:r *S-1-5-19:(F)`) sonrası süreç hesabı (LA) erişimini
      # korur, dosya OKUNUR / dizin LİSTELENİR (19 kırmızı + 3 hata — UAC-süzgeçli belirteçle bile). D:\a\_temp'te aynı komut doğru.
      # Adım kilidi İŞLEVSEL ölçer; ölçülmüyorsa TEMP'i korumalı olağan profil biçimine getirir, yine olmazsa `$RUNNER_TEMP/pemf-tmp`'yi
      # hazırlayıp TEMP / TMP'yi oraya yönlendirir (GITHUB_ENV); hiçbiri ölçülmezse adım DÜŞER (süit boşuna koşmaz).
      # Kapı: tests/test_ci_temp_acl_YS1j.py.
      - name: Koşucu TEMP ACL'i (olağan profil biçimi)
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/ci_temp_acl.py

      # YS1k: kurucu kanca testleri (18K ACİL DURDUR, SYH2 / Y296 kaldırma, i18n başlatıcı, kaldırma yetim süreç — 17 test) `makensis`
      # ister; koşucuda NSIS YOK ("makensis yok" diye ATLIYORLARDI). Ürün kurucusunu derleyen Tauri CLI 2.11.4'ün sabitlediği dağıtım
      # (nsis-3.11.zip SHA1 ef7ff767… · nsis_tauri_utils v0.5.3 SHA1 75197fee… — ikili, yerel Tauri önbelleğiyle bayt bayt aynı) SHA-256
      # ile doğrulanır, Tauri düzeninde açılır; yol testlere `PEMF_MAKENSIS` ile verilir. Kapı: test_ci_workflow_gate.py (…NSIS_YS1k).
      - name: NSIS (Tauri kurucu derleyicisi, sabit özet)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          z="$RUNNER_TEMP/nsis-3.11.zip"; d="$RUNNER_TEMP/tauri/NSIS"; e="$d/Plugins/x86-unicode/additional"
          curl -fsSL --retry 3 -o "$z" https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip
          echo "c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1  $z" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tauri" && unzip -q "$z" -d "$RUNNER_TEMP/tauri" && mv "$RUNNER_TEMP/tauri/nsis-3.11" "$d"
          mkdir -p "$e"
          curl -fsSL --retry 3 -o "$e/nsis_tauri_utils.dll" https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll
          echo "5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709  $e/nsis_tauri_utils.dll" | sha256sum -c -
          "$d/makensis.exe" -VERSION
          echo "PEMF_MAKENSIS=$(cygpath -w "$d/makensis.exe")" >> "$GITHUB_ENV"

      # YS1m (c2d9476a koşusu: 12 637 / 0 kırmızı, kapsam %99,99 — `file_acl` 2 satır): Y96 paylaşılan grup ACE'i (`lock_down_file` /
      # `lock_down_dir`) bu makinede OLUŞTURULMUŞ bir yerel grup ister; koşucuda hiç yok. Grup ÜYELİKSİZ kurulur: üyelik belirtece
      # yalnız YENİ oturum açmada girer (barındırılan koşucuda hesap parolasına dokunulmaz) → üyelik isteyen 3 davranış testi yine
      # atlar (CI-ATLANAN, ORTAM); grup kolunu DACL'den ölçen test koşar. Kapı: test_ci_workflow_gate.py (…YEREL_GRUP_YS1m).
      - name: Paylaşılan yerel grup (Y96, üyeliksiz)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          net localgroup pemf-ci-paylasim *> $null
          if ($LASTEXITCODE -ne 0) { net localgroup pemf-ci-paylasim /add /comment:"PEMF CI Y96 grup kolu (uyeliksiz)"; if ($LASTEXITCODE -ne 0) { exit 1 } }
          net localgroup pemf-ci-paylasim
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ⚠️ Y30 / D4.10 (B-10.3): `-rs` her ATLAMAYI nedeniyle listeler — CI varsayılan kipte koşar ve kardeş kaynak
      # yoksa ≥193 test atlanır; nedenler görünmeden "yeşil" okunuyordu. Yayın öncesi ZORUNLU kip ayrı betikte:
      # scripts/yayin_oncesi_suit.ps1 (publish_release.ps1'in zorunlu adımı).
      # ⚠️ 4A-4.1 (4-A incelemesi): `-r<harfler>` pytest'in varsayılanı `fE`'nin YERİNE geçer — `-rs` tek başına kısa özetteki
      # FAILED/ERROR satırlarını siliyordu. `-rfEs`: kırmızılar ve atlama nedenleri birlikte.
      # ⚠️ Y312 · YGH (sahip 20-11 "CI paraleli de zincire"): adım PARALEL — `-n auto --dist loadgroup`. `loadgroup` ŞART:
      # tests/conftest.py zamanlayıcısı (tests/xdist_grup.py: dosya birimi + "seri" grubu tek işçide) yalnız loadgroup'ta devreye
      # girer; yalnız `-n` dosyaları işçilere BÖLER. pytest-cov işçi kapsamlarını birleştirir; junit'i denetleyici yazar (atlama kapısı
      # aynen okur). Kapı: tests/test_ci_paralel_xdist_Y312.py. (Y320: Linux pytest adımı Linux işiyle birlikte kalktı — YG1'in Linux
      # kırmızıları Linux uyumsuzluğuydu, paralel değil; YGH geri alması GEREKSİZ.)
      # ⚠️ KAPSAM RATCHET'İ YALNIZ WINDOWS'TA (2026-08-09 denetimi, Tier 3).
      # İki sebep: (a) ürün Windows'ta çalışır, (b) `fail_under` eşiği Windows'ta ölçüldü
      # (%54,24). Linux'ta DPAPI/ACL/serial gibi platforma özgü yollar hiç koşmadığı için aynı
      # eşik orada yanlış-kırmızı üretirdi. Eşik `pyproject.toml → [tool.coverage.report]`.
      # NOT: eşik ayarlıydı ama CI kapsamı HİÇ ÖLÇMÜYORDU — yani ratchet boş bir güvenceydi.
      # YS1i (3bec8be9 koşusu): koşucu (runneradmin) YÜKSELTİLMİŞ → ürünün kilidi Administrators'a tam yetki verdiği için ACL /
      # ikinci-hesap benzetimleri ölçülemedi (24 kırmızı + 3 hata, kapsam %99,98). Süit, ürünün ve geliştiricinin koştuğu gibi
      # UAC-SÜZGEÇLİ belirteçle koşar (scripts/ci_kisitli_belirtec.py: Administrators yalnız-ret, bütünlük orta). `shell: bash`:
      # pwsh 7 açılışta PSModulePath'e kendi yollarını ekleyip alt powershell.exe 5.1'e sızdırıyordu → Get-Acl yüklenemiyordu (5).
      - name: Kritik-yol testleri + kapsam ratcheti
        if: runner.os == 'Windows'
        shell: bash
        env:
          PEMF_SIMULATE: ""
          PEMF_GITLEAKS_ZORUNLU: "1"
          PEMF_DEMA_DIST_ZORUNLU: "1"   # YS1g: DEMA dist yukarıda derlenir → o kapı ATLANAMAZ
        run: python scripts/ci_kisitli_belirtec.py pytest tests -n auto --dist loadgroup -v -rfEs --no-header --cov --cov-report=term --junitxml=pytest-junit.xml

      # ⚠️ A-46 / D2.07: testler geçse bile "sqlcipher" nedenli ATLAMA varsa iş KIRMIZI. Kurulum adımı
      # bağlayıcıyı içe aktaramazsa iş zaten orada durur; bu adım kalan sessiz yolu kapatır (bağlayıcı
      # bir testte yüklenemedi / yeni bir test sqlcipher3'ü atlayarak eklendi). Çıkış 2 = junit yok/boş (kör).
      # YS1g: test başına sonuç (atlama NEDENİ dahil) junit eseri olarak saklanır — kırmızı / atlama listesi günlükten değil buradan
      # çıkarılır (CI-ATLANAN tablosu, istem 66). Kırmızı koşuda da yüklenir.
      - name: Test raporu (junit) eseri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-${{ matrix.os }}
          path: pytest-junit.xml
          retention-days: 30
          if-no-files-found: error

      - name: sqlcipher atlama kapısı (A-46)
        run: python scripts/ci_sqlcipher_atlama_kapisi.py pytest-junit.xml

  sir-taramasi:
    name: sır taraması (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ⚠️ DENETİM 2026-08-09 (Tier 3): `.pre-commit-config.yaml` gitleaks hook'u TANIMLIYDU ama
    # `pre-commit install` HİÇ ÇALIŞTIRILMAMIŞTI (`.git/hooks` boştu) — yani kapı bir kez bile
    # açılmamıştı. Depo PUBLIC ve geçmişinde canlı sır bulunmuş bir depo (`config/credentials/*`,
    # `esp` dalı). Hook yalnız onu kuran kişiyi korur; CI işi HERKESİ korur — commit'i kimin
    # yaptığından bağımsız. Bu yüzden her ikisi de var.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks GEÇMİŞİ de tarasın; yalnız son commit yetmez
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  launcher:
    name: launcher (cargo)
    runs-on: windows-latest      # üretim platformu; Windows'a özgü yollar burada derlenir
    timeout-minutes: 45          # Y243: + kapsam derlemesi (enstrümanlı) ve cargo-llvm-cov kurulumu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      # ⚠️ `--all-targets`: entegrasyon testleri (core/tests/real_artifacts.rs) da koşsun.
      # Onlar üretim manifest'ini okuyup şema/URL/platform değişmezlerini doğrular — yayın
      # hatalarını yakalayan asıl kapı orasıdır.
      - name: cargo test
        working-directory: launcher
        run: cargo test --workspace --all-targets --locked
      # Y243 (KP-2 A5): başlatıcı satır kapsamı eşiği. Araç sürümü SABİT (cargo-llvm-cov 0.9.1, `--locked`); payda launcher/core/src +
      # launcher/app/src (entegrasyon testleri `tests/` hariç; bağımlılıklar aracın varsayılanıyla hariç). Eşik ölçülenin ~1 puan
      # altı (KP-1 / KP-2: satır %80,77) — yalnız YÜKSELTİLİR. KP-2 kapanış (2026-11-03): %82,16 (dosya içi #[cfg(test)]
      # modülleri paydada; ürün satırları %81,48 — KP-3 A2: burada %81,43 yazıyordu, kesin ölçüm %81,48) → 81. KP-3 AŞAMA 0
      # (2026-11-07, d45d9cf2): %82,04 (bu adımın ölçüsü — llvm toplam).
      # KP-3 AŞAMA D (2026-11-08, uç 6c7d4f10): %83,75 (aynı ölçü) → 82.
      # KP-4 A1 (Y257 c, sahip 08.11): `launcher/app/src/kabuk.rs` (S sınıfı Tauri kabuğu — pencere / WebView / gerçek platform; 44 işlev
      # → KP-5 B2 52: A2c'nin 8 ince kök kabuğu, gövdeleri `_ile` ölçülür),
      # `launcher/app/kapsam_siniflari.json`) ölçümden GEREKÇELİ dışlanır → bu adım "ürün ölçüsü"dür (S hariç). Dışlamanın dürüstlüğü:
      # `tests/test_KP3_main_rs_kapsam_siniflari.py` (S yalnız kabuk.rs'te, orada S dışı işlev / test yok, desen başka dosya yakalamaz).
      # KP-4 C (2026-11-11, uç da182963 — launcher o günden beri değişmedi): İKİ ölçü — llvm toplam (KP-3 ile karşılaştırılabilir)
      # %86,99 (13 693 satır, 1 782 eksik) · ÜRÜN ölçüsü (bu adım; + kabuk.rs hariç) %90,26 (13 150 satır, 1 281 eksik) → 82 → 89.
      # KP-5 F (2026-11-14, uç a5ba8313 — B1–B4 sonrası; launcher o günden beri değişmedi): llvm toplam %88,14 (14 414 satır,
      # 1 709 eksik) · ÜRÜN ölçüsü (bu adım) %91,47 (13 864 satır, 1 183 eksik) → 89 → 90.
