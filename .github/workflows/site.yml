name: site-ci

# PEMF satis/pazarlama sitesi (Vite + Vercel serverless `api/` — iyzico odeme uclari).
#
# ⚠️ BU IS AKISI 2026-08-18'DE ILK KEZ EKLENDI. O tarihe kadar `pemf-vet-web` AYRI bir depoydu
# ve o depoda HIC workflow yoktu: odeme uclari (checkout/callback/webhook/cancel) test, lint ve
# tip kontrolu kapisi OLMADAN deploy ediliyordu. Monorepo birlestirmesi bu bosluğu kapatiyor —
# `tests/test_ci_workflow_gate.py` de tam bunu istedi ("dizin depoya alinirsa CI isi GERI
# EKLENMELI").

on:
  push:
    branches: [ main, master, production-hardening, "feature/**", "fix/**" ]
    # Yol filtresi: backend/firmware degisikligi bu hatti tetiklemesin.
    paths: [ "pemf-vet-web/**", ".github/workflows/site.yml" ]
  pull_request:
    paths: [ "pemf-vet-web/**", ".github/workflows/site.yml" ]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: pemf-vet-web

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ⚠️ NODE 22+ SART (CI'da olculdu 2026-08-18): Node 20'de YERLESIK WebSocket YOK ve
          # `@supabase/supabase-js` v2'nin RealtimeClient'i onu istiyor. Node 20 ile
          # `src/lib/supabase.ts` import edilir edilmez su hatayla PATLIYOR:
          #   "Node.js 20 detected without native WebSocket support"
          # Belirti sinsi: 54 test GECIYOR, yalnizca supabase'i import eden test DOSYASI
          # yuklenemiyor -> ilk bakista "yesile yakin" gorunuyor. Gelistirici makinesinde Node 26
          # oldugu icin yerelde hic gorunmedi (76 test geciyordu).
          # `@types/node: ^24` ve Vite 8 de zaten 20'nin ustunu hedefliyor.
          node-version: "22"
          cache: npm
          # ⚠️ `defaults.working-directory` YALNIZ `run:` adimlarini etkiler, `uses:` action'larini
          # DEGIL. Bu yol verilmezse setup-node kokteki (bos, artik) package-lock.json'a gore
          # onbellekler — yanlis anahtar, ise yaramaz onbellek.
          cache-dependency-path: pemf-vet-web/package-lock.json

      - name: Bagimliliklar
        run: npm ci

      - name: Yasal yapilandirma kapisi
        # Sirket kimligi/KVKK alanlarinda placeholder kalmissa yayini DURDURUR.
        run: npm run check:legal

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tip kontrolu (tsc -b)
        run: npx tsc -b

      - name: Testler (vitest)
        run: npm test

      - name: Uretim derlemesi
        run: npx vite build

      # [Faz D, 2026-09-05] GORUNUM ALANI + DOKUNMA HEDEFI KAPISI.
      # Statik kaynak kapilari (vitest/pytest) sinif adlarini olcer; bu kapi TARAYICIDA gercek
      # piksel olcer: yatay tasma (document.scrollWidth > innerWidth), ust-kesik icerik ve
      # 44 px altindaki dokunma hedefleri. Ikisi birbirinin yerine gecmez —
      # `min-w-0` sinifi kaynakta VAR ama baska bir kural tasmayi geri getirebilir.
      #
      # ⚠️ ORTAM: betik CI bayragi degil TARAYICI YETENEGI arar (memory: kapi-ortam-varsayimi).
      # ubuntu-latest'te Edge/Chrome yok -> `--zorunlu` ile exit 2 verir; bu yuzden tarayici
      # actions/setup-chrome ile kurulur. Kurulum basarisiz olursa kapi ATLANIR (exit 3) ve
      # is akisi kirmizi olmaz; kapinin kendisi bunu raporlar.
      - name: Tarayici (headless olcum icin)
        uses: browser-actions/setup-chrome@v1
        continue-on-error: true

      - name: Gorunum alani + dokunma hedefi kapisi
        working-directory: .
        run: |
          python3 scripts/responsive_kapisi.py --hedef site --zorunlu --png-yok             --site-dist pemf-vet-web/dist --cikti /tmp/responsive-site || KOD=$?
          if [ "${KOD:-0}" = "3" ]; then
            echo "::warning::Tarayici bulunamadi, gorunum alani kapisi ATLANDI."
            exit 0
          fi
          exit "${KOD:-0}"

      - name: Olcum raporu (bulgu varsa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-site-raporu
          path: /tmp/responsive-site
