name: site-ci

# PEMF satis/pazarlama sitesi (Vite + Vercel serverless `api/` — iyzico odeme uclari).
#
# ⚠️ BU IS AKISI 2026-08-18'DE ILK KEZ EKLENDI. O tarihe kadar `apps/web` AYRI bir depoydu
# ve o depoda HIC workflow yoktu: odeme uclari (checkout/callback/webhook/cancel) test, lint ve
# tip kontrolu kapisi OLMADAN deploy ediliyordu. Monorepo birlestirmesi bu bosluğu kapatiyor —
# `tests/test_ci_workflow_gate.py` de tam bunu istedi ("dizin depoya alinirsa CI isi GERI
# EKLENMELI").

on:
  push:
    branches: [ main, master, production-hardening, "feature/**", "fix/**", "duzeltme/**" ]
    # Yol filtresi: backend/firmware degisikligi bu hatti tetiklemesin.
    # ⚠️ `scripts/responsive_kapisi.py` DE BURADA OLMALI: bu is akisi onu CALISTIRIYOR ama
    # izlemiyordu -> kapi betigini bozan bir degisiklik CI'da hic gorunmuyordu (2026-09-05'te
    # tam bu oldu: kapi ubuntu-24.04'te tarayiciyi acamiyordu ve kirmizi ancak ALAKASIZ bir
    # site degisikligiyle ortaya cikti). Bir isin CALISTIRDIGI her dosya tetikleyicisindedir.
    paths: [ "apps/web/**", ".github/workflows/site.yml", "scripts/responsive_kapisi.py", "tests/responsive_kapisi_baseline.json" ]
  pull_request:
    paths: [ "apps/web/**", ".github/workflows/site.yml", "scripts/responsive_kapisi.py", "tests/responsive_kapisi_baseline.json" ]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  site:
    # CT2 a: iş adı scripts/ci_sozlesmesi.json `kosulluysa_gerekli` ile AYNI (yol süzgeçli — koştuysa yeşil olmalı)
    name: site (lint + tsc + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0        # CT1 f-3: fark kapsamı tabanı (birleşme tabanı) için tam geçmiş

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # ⚠️ NODE 22+ SART (CI'da olculdu 2026-08-18): Node 20'de YERLESIK WebSocket YOK ve
          # `@supabase/supabase-js` v2'nin RealtimeClient'i onu istiyor. Node 20 ile
          # `src/lib/supabase.ts` import edilir edilmez su hatayla PATLIYOR:
          #   "Node.js 20 detected without native WebSocket support"
          # Belirti sinsi: 54 test GECIYOR, yalnizca supabase'i import eden test DOSYASI
          # yuklenemiyor -> ilk bakista "yesile yakin" gorunuyor. Gelistirici makinesinde Node 26
          # oldugu icin yerelde hic gorunmedi (76 test geciyordu).
          # `@types/node: ^24` ve Vite 8 de zaten 20'nin ustunu hedefliyor.
          node-version: "22"
          cache: npm
          # ⚠️ `defaults.working-directory` YALNIZ `run:` adimlarini etkiler, `uses:` action'larini
          # DEGIL. Bu yol verilmezse setup-node kokteki (bos, artik) package-lock.json'a gore
          # onbellekler — yanlis anahtar, ise yaramaz onbellek.
          cache-dependency-path: apps/web/package-lock.json

      - name: Bagimliliklar
        run: npm ci

      - name: Yasal yapilandirma kapisi
        # Sirket kimligi/KVKK alanlarinda placeholder kalmissa yayini DURDURUR.
        run: npm run check:legal

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tip kontrolu (tsc -b)
        run: npx tsc -b

      # D3.20 (B-7.10): odeme uclari (api/ — Vercel islevleri: checkout / callback / webhook / cancel / tokens) `tsc -b`nin
      # DISINDA (tsconfig.app include=src); para yolundaki tip hatasi push'ta hicbir kirmizi uretmiyordu. YUTULMAZ (|| true yok).
      - name: Tip kontrolu — odeme uclari (tsc -p api)
        run: npx tsc -p api --noEmit

      # Y243 (KP-2 A5): `--coverage` → vite.config.ts `test.coverage.thresholds` UYGULANIR (@vitest/coverage-v8 devDependency).
      - name: Testler (vitest)
        run: npm test -- --coverage

      # CT1 f-3 (istem 66 · Y311 / Y325): dalın değiştirdiği her ölçülen satır testle koşmuş olmalı (fark kapsamı %100; vitest lcov).
      # Eşikler (vite.config.ts thresholds) tests/kapsam_tabani.json'dan. Kapı: tests/test_CT1f_kapsam_tabani_KILIDI.py
      - name: Fark kapsamı kapısı
        working-directory: .
        run: python3 scripts/fark_kapsami.py --lcov apps/web/coverage/lcov.info:apps/web

      - name: Uretim derlemesi
        run: npx vite build

      # [Faz D, 2026-09-05] GORUNUM ALANI + DOKUNMA HEDEFI KAPISI.
      # Statik kaynak kapilari (vitest/pytest) sinif adlarini olcer; bu kapi TARAYICIDA gercek
      # piksel olcer: yatay tasma (document.scrollWidth > innerWidth), ust-kesik icerik ve
      # 44 px altindaki dokunma hedefleri. Ikisi birbirinin yerine gecmez —
      # `min-w-0` sinifi kaynakta VAR ama baska bir kural tasmayi geri getirebilir.
      #
      # ⚠️ ORTAM: betik CI bayragi degil TARAYICI YETENEGI arar (memory: kapi-ortam-varsayimi).
      # Runner'daki hazir tarayiciya guvenilmez (Edge CDP portunu acamiyor — asagidaki not); bu yuzden
      # Chrome actions/setup-chrome ile kurulur. Kurulum basarisiz olursa kapi ATLANMAZ: `--zorunlu`
      # tarayicisiz ortamda 3 yerine 2 dondurur ve adim KIRMIZI biter (bilincli — CI'da kapi SART).
      - name: Tarayici (headless olcum icin)
        id: tarayici
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1.7.3
        continue-on-error: true

      # ⚠️ KURULAN TARAYICI ACIKCA BILDIRILIR (2026-09-18, olculen ariza): betik sabit bir
      # aday listesi tariyor ve o listede `/usr/bin/microsoft-edge` Chrome'dan ONCE geliyor.
      # Runner imaji artik Edge de tasidigi icin betik, BU ADIMDA KURULAN Chrome'u yok sayip
      # Edge'i seciyordu; o Edge de CDP portunu acamiyor (D-Bus) -> kapi kirmizi.
      # Adimin CIKTISI dogrudan betige verilir; tahmin listesi devreye HIC girmez.
      # D6.56 (B-10.184): `--zorunlu` altinda betik 3 DONDURMEZ (scripts/responsive_kapisi.py) -> eski
      # "3 ise uyarip atla" dali ULASILAMAZDI ve kaldirildi; her sifir-disi kod adimi KIRMIZI yapar.
      - name: Gorunum alani + dokunma hedefi kapisi
        working-directory: .
        env:
          PEMF_TARAYICI: ${{ steps.tarayici.outputs.chrome-path }}
        run: |
          python3 scripts/responsive_kapisi.py --hedef site --zorunlu --png-yok             --site-dist apps/web/dist --cikti /tmp/responsive-site || KOD=$?
          exit "${KOD:-0}"

      - name: Olcum raporu (bulgu varsa)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: responsive-site-raporu
          path: /tmp/responsive-site
