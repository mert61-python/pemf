name: Upload to TestFlight

on:
  push:
    branches:
      - upload-testflight

# DENETİM 2026-08-04 (P3): `permissions:` bloğu YOKTU → iş akışı deponun VARSAYILAN
# GITHUB_TOKEN yetkisini alıyordu (çoğu depoda contents: write). Bu iş akışlarının hiçbiri
# yazma yapmıyor (release/push/paket yok — doğrulandı). Ele geçirilmiş bir bağımlılık ya da
# üçüncü-parti action, token'la depoya YAZABİLİRDİ. En az yetki: yalnız okuma.
permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA-pinli; v3 Node16 ile KULLANIMDAN KALKTI)

      - name: Upload to TestFlight
        # DENETİM 2026-08-04 (P3): sırlar `${{ secrets.* }}` ile DOĞRUDAN komut satırına
        # gömülüyordu. Kazanç (b) maddesindedir: komut hata verip kabuk satırı yankılanırsa ya da
        # `set -x` benzeri bir izleme açılırsa, artık log'a parolanın KENDİSİ değil `$APP_...`
        # değişken ADI düşer (GitHub maskelemesi yalnız TAM eşleşmeyi yakalar; parçalanmış ya da
        # kodlanmış hâlini değil). Ayrıca sır tek bir ADIMA kapsanır, tüm job'a değil.
        #
        # ⚠️ DÜRÜSTLÜK NOTU (denetim 2026-08-04): bu değişiklik `ps`/proses-listesi sızıntısını
        # ORTADAN KALDIRMAZ — kabuk `$APP_SPECIFIC_PASSWORD`'ü genişlettiği için parola yine
        # altool'un argv'sinde görünür. İlk yazdığım gerekçe bu yönüyle YANLIŞTI. Gerçek çözüm
        # `--apiKey`/`--apiIssuer` (App Store Connect API anahtarı) ile parolayı komut satırından
        # tamamen çıkarmaktır; o değişiklik Apple hesabı tarafında anahtar üretmeyi gerektirir.
        # Ortam değişkeni olarak verilip kabukta genişletiliyor.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app -f "mobile_builds/PEMF-Vet-1.0.0-ios-production.ipa" -t ios -u "$APPLE_ID" -p "$APP_SPECIFIC_PASSWORD"
