# PEMF Vet Client — macOS build (imzalı + notarized), Apple'ın bulut Mac-runner'ında.
# Fiziksel Mac GEREKMEZ; sen bu makineden tetikle (Actions > Run workflow) → imzalı .dmg artifact.
#
# GEREKEN SECRET'lar (repo Settings > Secrets and variables > Actions > New repository secret):
#   APPLE_CERTIFICATE          : "Developer ID Application" .p12 → base64 (bkz. MACOS-BUILD-GUIDE.md)
#   APPLE_CERTIFICATE_PASSWORD : .p12 dışa-aktarma şifresi
#   APPLE_SIGNING_IDENTITY     : "Developer ID Application: Adın (TEAMID)"
#   APPLE_ID                   : Apple ID e-postan (notarization)
#   APPLE_PASSWORD             : appleid.apple.com > app-specific password
#   APPLE_TEAM_ID              : 10 karakterli Team ID
name: macOS Client

on:
  workflow_dispatch: {}          # elle tetikle
  push:
    tags: ["client-mac-v*"]      # ya da tag push ile

jobs:
  macos:
    runs-on: macos-14            # Apple Silicon runner (universal build için ideal)
    timeout-minutes: 40          # build(~8) + notarytool --wait(--timeout 20m) + log; runaway koruması
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Frontend bağımlılıkları
        run: npm ci

      # App Store Connect API key'i (.p8) secret'tan dosyaya yaz — notarization API-key yöntemi için.
      # Secret APPLE_API_KEY_P8 = AuthKey_XXXX.p8 dosyasının base64'ü.
      - name: API key (.p8) yaz
        run: |
          mkdir -p "$HOME/private_keys"
          # openssl base64 -d -A → macOS'ta bulletproof (BSD base64 '--decode' desteklemeyebilir)
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | openssl base64 -d -A > "$HOME/private_keys/AuthKey.p8"
          chmod 600 "$HOME/private_keys/AuthKey.p8"
          # doğrula: PKCS#8 private key başlığı olmalı
          head -1 "$HOME/private_keys/AuthKey.p8"

      # tauri-action YALNIZ build+sign (APPLE_API_* YOK → notarize etmez). Notarization'ı aşağıda MANUEL
      # yapıyoruz çünkü tauri-action notarytool çıktısını yutup 4×30dk sessiz hang'i teşhis-edilemez kıldı.
      - name: Build + imza (universal .dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          PEMF_GHCR_TOKEN: ${{ secrets.PEMF_GHCR_TOKEN }}   # ghcr private imaj çekme (client'a gömülür)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target universal-apple-darwin

      - name: Notarize .dmg (MANUEL — Apple durumu akışa yansısın)
        run: |
          set -o pipefail
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          echo "DMG: $DMG"
          KEY="$HOME/private_keys/AuthKey.p8"; KID="${{ secrets.APPLE_API_KEY }}"; ISS="${{ secrets.APPLE_API_ISSUER }}"
          echo "::group::notarytool submit (--wait, --timeout 20m)"
          set +e
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$KID" --issuer "$ISS" --wait --timeout 20m 2>&1 | tee /tmp/notary.log
          RC=$?
          set -e
          echo "::endgroup::"
          echo "notarytool_rc=$RC"
          SID=$(grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/notary.log | head -1)
          echo "submission_id=$SID"
          if [ -n "$SID" ]; then
            echo "::group::notarytool log $SID (Apple'in GERCEK sebebi: In Progress / Invalid / agreement)"
            xcrun notarytool log "$SID" --key "$KEY" --key-id "$KID" --issuer "$ISS" || true
            echo "::endgroup::"
          fi
          if [ "$RC" -eq 0 ]; then
            xcrun stapler staple "$DMG" && echo "NOTARIZE_STAPLE_OK"
          else
            echo "NOTARIZE_FAILED — yukaridaki notarytool log Apple'in sebebini gosterir"
            exit 1
          fi

      - name: .dmg'yi artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: PEMF-Vet-Client-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
