# Frontend bağımlılık CVE taraması + güncelleme PR'ları (audit B-9.3).
# npm (package.json) + workflow action'ları haftalık; açık/eski paketler için otomatik PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Expo SDK / RN / React bleeding-edge (SDK 56, React 19) → major bump'lar koordineli olmalı.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
