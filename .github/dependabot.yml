# Bağımlılık CVE taraması + otomatik güncelleme PR'ları (audit B-9.3).
# GitHub Dependabot: requirements*.txt (pip) + workflow action'ları haftalık taranır;
# açık/eski bağımlılıklar için otomatik PR açılır (maintainer test edip birleştirir).
# NOT: torch / torchvision / onnx Y3 gereği TAMAMEN dışlı (her pip ekosisteminde); ultralytics / numpy yalnız major'da.
# PR SINIRLARI (YH D6, 2026-10-22 — sahip kararı 2026-10-13: dışlama + PR sınırları YAYIN PUSH'UNDAN önce dosyada): Dependabot bu depoda
# HİÇ koşmadı; açılınca bir kerede PR dalgası (her biri CI + Vercel önizlemesi) açmasın diye toplam sınır ~50 → 15. Kapı:
# tests/test_YH_D6_dependabot_Y3_ve_PR_siniri.py
# CT2 e (istem 66 · Y326 katman 8): github-actions + npm + cargo + pip ekosistemleri HAFTALIK ve TOPLU (her ekosistemde `surum-guncellemeleri`
# grubu = haftada tek sürüm PR'ı; güvenlik yamaları ayrı grup). İş akışı eylemleri tam SHA ile sabit — Dependabot SHA + yorumdaki
# sürümü birlikte günceller. Y344-2: `/docker` girdisi Docker dağıtımıyla birlikte kalktı. Kapı: tests/test_CT2e_tedarik_zinciri_KAPILARI.py
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # CT2 e (Y326 katman 8): sürüm güncellemeleri de TOPLU — ekosistem başına haftada TEK PR (Y3 / koordinasyon dışlamaları geçerli).
      surum-guncellemeleri:
        applies-to: version-updates
        patterns: ["*"]
      # Güvenlik yamaları tek PR'da toplansın (gürültü azalt).
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Y3 (sahip kararı): onnx 1.15.0 / torch 2.1.2+cpu pinleri AYNEN korunur — yükseltme YASAK. update-types YOK = bu paket
      # için HİÇBİR sürüm / güvenlik PR'ı açılmaz (eski hâl torch'u yalnız major/minor'da dışlıyor, onnx'i hiç dışlamıyordu).
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "onnx"
      - dependency-name: "ultralytics"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"   # KRİTİK: torch 2.1.2 numpy<2 ister
        update-types: ["version-update:semver-major"]

  # ── DENETİM 2026-08-04 (P3): kapsam YALNIZ pip:"/" + github-actions idi. ──────────────
  # Kapsam dışı kalanlar tam da güvenlik-kritik olanlardı: Rust launcher (bütünlük kökü —
  # zip açma, TLS indirme, backend spawn; 300+ crate), iki npm projesi (biri ÖDEME sitesi) ve
  # iki ek requirements dosyası. security.yml de tabloyu kapatmıyor (yalnız pip-audit,
  # `continue-on-error: true`). Aşağıdakiler o boşlukları kapatır.

  # Rust launcher — SHA256 doğrulama + zip-slip koruması + E-stop mantığı burada.
  - package-ecosystem: "cargo"
    directory: "/launcher"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # CT2 e (Y326 katman 8): sürüm güncellemeleri de TOPLU — ekosistem başına haftada TEK PR (Y3 / koordinasyon dışlamaları geçerli).
      surum-guncellemeleri:
        applies-to: version-updates
        patterns: ["*"]
      security-patches:
        applies-to: security-updates
        patterns: ["*"]

  # GPU inference mikroservisi (:8100) — kendi web yığını var.
  - package-ecosystem: "pip"
    directory: "/ai_service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      # CT2 e (Y326 katman 8): sürüm güncellemeleri de TOPLU — ekosistem başına haftada TEK PR (Y3 / koordinasyon dışlamaları geçerli).
      surum-guncellemeleri:
        applies-to: version-updates
        patterns: ["*"]
    ignore:
      # Y3 (sahip kararı): onnx 1.15.0 / torch 2.1.2+cpu pinleri AYNEN korunur — yükseltme YASAK. update-types YOK = bu paket
      # için HİÇBİR sürüm / güvenlik PR'ı açılmaz (eski hâl torch'u yalnız major/minor'da dışlıyor, onnx'i hiç dışlamıyordu).
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "onnx"
      # YLI-A2.4: onnx 1.15.0 + numpy 1.26.4 (numpy 2 ABI'si onnx 1.15 tekerleğini kırar) — pip:"/" ile aynı koordinasyon.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ultralytics"
        update-types: ["version-update:semver-major"]

  # ── MONOREPO (2026-08-18): yukarıdaki blokta yazılı ÖN KOŞUL SAĞLANDI ─────────────────
  # O not şöyle diyordu: "npm ağaçları EKLENEMEDİ — çünkü sürüm kontrolünde DEĞİLLER …
  # ÇÖZÜM kod değil SÜREÇ: bu iki projeyi (node_modules hariç, lock DAHİL) depoya alın; sonra
  # buraya `npm` ekosistemi olarak `/apps/ui` ve `/apps/web` girdilerini ekleyin."
  # `apps/ui/` ve `apps/web/` artık subtree ile depoda ve lock dosyaları izleniyor → talimat
  # uygulanıyor. Denetimde bulunan somut açıklar bu iki ağaçtaydı: apps/web lock'unda
  # undici 5.28.4 (CVE-2025-22150) ve path-to-regexp 6.1.0 (CVE-2024-45296).

  # Mobil/web arayüz (Expo SDK 56 / React 19 / RN 0.85 — bleeding-edge).
  - package-ecosystem: "npm"
    directory: "/apps/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # CT2 e (Y326 katman 8): sürüm güncellemeleri de TOPLU — ekosistem başına haftada TEK PR (Y3 / koordinasyon dışlamaları geçerli).
      surum-guncellemeleri:
        applies-to: version-updates
        patterns: ["*"]
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # ⚠️ Major bump'lar KOORDINELI olmalı: Expo SDK / RN / React üçlüsü birlikte yükselir,
      # tek başına bump APK build'ini kırar (apps/ui/.github/dependabot.yml'den taşındı).
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]

  # ÖDEME sitesi (iyzico + Supabase + Vercel serverless `api/`). Bugüne kadar HİÇBİR otomatik
  # CVE taramasında değildi ve deponun CI'ı da yoktu — para yolu taşıyan tek yüzey.
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # CT2 e (Y326 katman 8): sürüm güncellemeleri de TOPLU — ekosistem başına haftada TEK PR (Y3 / koordinasyon dışlamaları geçerli).
      surum-guncellemeleri:
        applies-to: version-updates
        patterns: ["*"]
      security-patches:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # CT2 e (Y326 katman 8): sürüm güncellemeleri de TOPLU — ekosistem başına haftada TEK PR (Y3 / koordinasyon dışlamaları geçerli).
      surum-guncellemeleri:
        applies-to: version-updates
        patterns: ["*"]
