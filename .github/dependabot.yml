# Bağımlılık CVE taraması + otomatik güncelleme PR'ları (audit B-9.3).
# GitHub Dependabot: requirements*.txt (pip) + workflow action'ları haftalık taranır;
# açık/eski bağımlılıklar için otomatik PR açılır (maintainer test edip birleştirir).
# NOT: torch/ultralytics/onnx AI-uyumluluğa bağlı → 'ignore' ile major-bump PR'ları kısılabilir.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Güvenlik yamaları tek PR'da toplansın (gürültü azalt).
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # AI çekirdeği: major/minor bump'lar model-uyumluluğunu kırabilir → yalnız güvenlik-yaması.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "torchvision"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ultralytics"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"   # KRİTİK: torch 2.1.2 numpy<2 ister
        update-types: ["version-update:semver-major"]

  # ── DENETİM 2026-08-04 (P3): kapsam YALNIZ pip:"/" + github-actions idi. ──────────────
  # Kapsam dışı kalanlar tam da güvenlik-kritik olanlardı: Rust launcher (bütünlük kökü —
  # zip açma, TLS indirme, backend spawn; 300+ crate), iki npm projesi (biri ÖDEME sitesi) ve
  # iki ek requirements dosyası. security.yml de tabloyu kapatmıyor (yalnız pip-audit,
  # `continue-on-error: true`). Aşağıdakiler o boşlukları kapatır.

  # Rust launcher — SHA256 doğrulama + zip-slip koruması + E-stop mantığı burada.
  - package-ecosystem: "cargo"
    directory: "/launcher"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]

  # Docker imajının requirements'ı (dizin /docker → pip:"/" bunu GÖRMEZ).
  - package-ecosystem: "pip"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GPU inference mikroservisi (:8100) — kendi web yığını var.
  - package-ecosystem: "pip"
    directory: "/ai_service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # ── MONOREPO (2026-08-18): yukarıdaki blokta yazılı ÖN KOŞUL SAĞLANDI ─────────────────
  # O not şöyle diyordu: "npm ağaçları EKLENEMEDİ — çünkü sürüm kontrolünde DEĞİLLER …
  # ÇÖZÜM kod değil SÜREÇ: bu iki projeyi (node_modules hariç, lock DAHİL) depoya alın; sonra
  # buraya `npm` ekosistemi olarak `/pf` ve `/pemf-vet-web` girdilerini ekleyin."
  # `pf/` ve `pemf-vet-web/` artık subtree ile depoda ve lock dosyaları izleniyor → talimat
  # uygulanıyor. Denetimde bulunan somut açıklar bu iki ağaçtaydı: pemf-vet-web lock'unda
  # undici 5.28.4 (CVE-2025-22150) ve path-to-regexp 6.1.0 (CVE-2024-45296).

  # Mobil/web arayüz (Expo SDK 56 / React 19 / RN 0.85 — bleeding-edge).
  - package-ecosystem: "npm"
    directory: "/pf"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # ⚠️ Major bump'lar KOORDINELI olmalı: Expo SDK / RN / React üçlüsü birlikte yükselir,
      # tek başına bump APK build'ini kırar (pf/.github/dependabot.yml'den taşındı).
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]

  # ÖDEME sitesi (iyzico + Supabase + Vercel serverless `api/`). Bugüne kadar HİÇBİR otomatik
  # CVE taramasında değildi ve deponun CI'ı da yoktu — para yolu taşıyan tek yüzey.
  - package-ecosystem: "npm"
    directory: "/pemf-vet-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
