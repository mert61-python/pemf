[workspace]
members = ["core", "app"]
resolver = "2"

[workspace.package]
version = "1.9.33"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
ureq = "2"
