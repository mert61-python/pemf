[package]
name = "pemf-launcher-core"
description = "PEMF Vet Client launcher — indirme/doğrulama/kurulum çekirdeği (UI'dan bağımsız)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
thiserror.workspace = true
ureq.workspace = true

# "Beni hatırla" oturumu Windows'ta DPAPI ile şifrelenir (bkz. secret_store.rs).
# `windows-sys` Tauri ağacında ZATEN var ve yerel cargo önbelleğinde mevcut → yeni ağ indirmesi
# gerektirmez (bu makinede crates.io throttle'ı belgeli).
[target.'cfg(windows)'.dependencies]
# `Win32_Storage_FileSystem`: GetDiskFreeSpaceExW — kurulum ÖNCESİ boş alan kontrolü
# (bkz. disk.rs; LattePanda eMMC'de kurulum 1,2 GB indirdikten sonra os error 112 ile ölüyordu).
# `Win32_Globalization`: GetUserDefaultUILanguage — I18N (Y161) Windows görüntüleme dili (bkz. dil.rs; yeni crate DEĞİL, aynı paketin özelliği).
# `Win32_System_Diagnostics_ToolHelp` + `Win32_System_Threading`: süreç listesi + ikili yolu — LN L5 · Y71 kapanışta YALNIZ kendi
# kökümüzdeki mosquitto öldürülür (bkz. backend.rs `surec_yollari`; yeni crate DEĞİL, aynı paketin özelliği).
# `Win32_Security_Authorization` + `Win32_System_WindowsProgramming`: ConvertStringSidToSidW / GetComputerNameW — LN L8 · Y96 paylaşılan
# grup SID'i bu makinenin YEREL grubu mu (bkz. install.rs `bu_makinenin_yerel_grubu_mu`; aynı paketin özelliği).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_System_WindowsProgramming"] }

# statvfs — Windows dışında boş alan okuma (bkz. disk.rs). `libc` bagimlilik agacinda ZATEN var.
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
