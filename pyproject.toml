# ============================================================================
# PEMF Backend — araç yapılandırması (audit B-2.1: statik analiz/format/tip yoktu)
# ----------------------------------------------------------------------------
# Ruff = CI-ENFORCED lint (F + E9 = gerçek buglar; temiz baseline → CI yeşil).
# Stil kuralları (E501/whitespace/annotation modernizasyonu) 28k satırlık olgun
# kodda 2200+ ihlal → BİLİNÇLİ olarak enforce EDİLMEZ; aşağıda kademeli açma yolu var.
# mypy = lenient (kademeli tipleme; kod büyük ölçüde untyped → CI'da ZORUNLU DEĞİL).
# Kurulum:  pip install -r requirements-dev.txt  &&  pre-commit install
# Çalıştır:  ruff check .   |   ruff format .   |   mypy servers utils database
# ============================================================================

# ============================================================================
# PROJE METADATASI (denetim 2026-09-17)
# ----------------------------------------------------------------------------
# Bu dosya 96 satır boyunca YALNIZ araç ayarı taşıyordu: `[project]` yok,
# `[build-system]` yok, `setup.py` yok. Depo kurulabilir bir Python dağıtımı
# değildi; kök dizinin kendisi import köküydü. IEC 62304 açısından "yazılım
# öğesi" tanımlamak için kurulabilir bir birim + makine-okunur sürüm metadatası
# gerekir.
#
# ⚠️ SÜRÜM BURAYA YAZILMAZ. `version = "1.9.50"` yazmak, sürümü DÖRDÜNCÜ bir yere
# koymak olurdu: versions.json (tek kaynak) → VERSION → CHANGELOG → pyproject.
# Bu depo tam bu tuzağa README'de ÜÇ kez düştü. Zincir tek yönlü kalır:
#     versions.json  --sync_versions.ps1-->  VERSION  --dynamic-->  pyproject
#
# ⚠️ `packages` AÇIKÇA listelenir. Düz yerleşimde (kökte 40 dizin) setuptools'un
# otomatik keşfi "Multiple top-level packages discovered" ile PATLAR — yani
# `[build-system]` eklemek bir şeyi düzeltmez, yeni bir kırık yol açardı.
#
# Kapı: tests/test_paket_sinirlari.py
# ============================================================================
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pemf-backend"
description = "PEMF Vet — kediye özel PEMF terapi kabini için headless backend servisi"
requires-python = ">=3.10,<3.11"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools]
# ⚠️ ELLE liste — otomatik keşif bu ağaçta çalışmaz (yukarıdaki nota bakın).
#
# ⚠️ `ai_hub` BİLEREK YOK. 84 MB ve içinde 20 model ağırlığı var; dahası kod koruması
# kararı gereği frozen EXE'de PYZ'den ÇIKARILIR ve diskteki `.pyd`/`.pyenc` olarak sevk
# edilir (`build_tools/PEMF_Backend_onedir.spec`: `a.pure`'dan silinir). Onu kurulabilir
# bir paket olarak ilan etmek o kararla çelişir ve yanlış sinyal verir.
# ⚠️ `pf/`, `pemf-vet-web/`, `launcher/` de yok: bunlar Python paketi değil.
packages = [
    "servers",
    "services",
    "database",
    "utils",
    "controllers",
    "scripts",
    "build_tools",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# Vendored / üretilmiş / build çıktısı DENETLENMEZ (bizim kaynağımız değil).
# ⚠️ TEK KAYNAK: CI `ruff check .` ile burayı okur; pre-commit'in ruff hook'u da
# `--force-exclude` ile aynı listeye uyar. Muafiyeti YALNIZ .pre-commit-config.yaml'a
# yazmak YETMEZ — 2026-08-18'de tam bunu yaptım ve CI `lint` işi kırmızı döndü (ca280ea):
# yerelde commit geçti, CI'da 10 hata. Yeni bir muafiyet gerekiyorsa ÖNCE buraya.
extend-exclude = [
    "ai_hub", "dist", "build", "builds", "buildPEMF", "release_assets",
    "dema-terapi-simülatörü", "web_static", "website", "templates",
    "frontend", "mobile", "bin", "data", "firmware", "lattekurulum",
    "__pycache__", ".pytest_cache",
    # DONMUŞ ARŞİV — silinen `esp` dalından kurtarılan doktora/TÜBİTAK eğitim kodu.
    # Değeri SADAKATİ: yayınlanmış sonuçları üreten kodun birebir hâli. Lint/format
    # düzeltmesi burada iyileştirme değil KAYIPTIR (ilk geçişte 316 düzeltme + 49 dosya
    # yeniden biçimlendirme ölçüldü).
    "training_archive",
]

[tool.ruff.lint]
# ENFORCED (CI yeşil kalmalı) — yüksek-sinyal gerçek-bug + import-düzeni:
#   F  = pyflakes  (undefined-name, unused-import/variable, bozuk f-string)
#   E9 = syntax / IO hataları
#   I  = isort (import sıralama) — prod-readiness A-2 (2026-07-08): 62 ihlal auto-fix'lendi, CI-enforced.
select = ["F", "E9", "I"]

# ── KADEMELİ AÇMA (hazır olunca select'e taşıyın; her biri bir temizlik gerektirir) ──
#   "B"  flake8-bugbear (~62): B904 raise-from(30)+B905 zip-strict(6) düzeltilebilir; AMA B008(26)
#        FastAPI `Depends()/Query()` default'ları = FALSE-POSITIVE → B'yi açmadan önce
#        [tool.ruff.lint.flake8-bugbear] extend-immutable-calls ile FastAPI'yi muaf tut.
#   "UP"   pyupgrade           (~180 ihlal) PEP585/604 modern annotation
#   "SIM"  flake8-simplify     (~75 ihlal)
#   "E","W" pycodestyle        (~1900 ihlal, E501 uzun-satır dahil)
# Kademe-1 YAPILDI (I eklendi). Sıradaki: B (yukarıdaki FastAPI-muafiyeti ile).

[tool.ruff.lint.per-file-ignores]
# Testler: assert-kullanımı vb. serbest. Scriptler: CLI print/deneysel kod.
"tests/*" = ["F811", "F401"]
"scripts/*" = ["F401"]

[tool.ruff.format]
# `ruff format` (black-uyumlu) HAZIR ama otomatik uygulanmadı — 28k satır tek-seferde
# reformat = dev-riskli devasa diff. pre-commit ile YALNIZ değişen dosyalarda kademeli uygulanır.
quote-style = "preserve"
indent-style = "space"

[tool.pytest.ini_options]
# Isaretler (marker): kayitli olmayan marker PytestUnknownMarkWarning verir ve `-m` ile
# secilemez. `entegrasyon` = agir/gercek-model testleri (release_assets agirliklari sart;
# yoksa tests/capraz.py ile ATLANIR). CI'da agirlik agaci olmadigi icin bu testler atlanir;
# yerel tam suitte PEMF_CAPRAZ_KAYNAK_ZORUNLU=1 atlamayi HATAYA cevirir.
markers = [
    "entegrasyon: gercek model agirliklariyla ucdan uca (agirlik yoksa atlanir)",
]

[tool.coverage.run]
# audit B-3.1: çekirdek modül kapsamı (AI-hub/scriptler hariç — ağır/ayrı).
#
# ⚠️ `utils` EKLENDİ (2026-08-09 denetimi, Tier 3). Ratchet'in kapsamadığı kod ratchet'siz
# demektir; oysa `utils` altında `data_export`, `encrypted_import`, `backup_recovery`,
# `secrets_manager`, `stm32_transport`, `image_domain` gibi veri ve donanım yolları yaşıyor —
# yani ölçülmesi en gerekli yerler tam da ölçüm dışındaydı.
source = ["servers", "database", "controllers", "utils"]
omit = ["*/__pycache__/*", "tests/*", "*/ai_hub/*"]

[tool.coverage.report]
# Kapsam RATCHET'i (regresyon önler): ÖLÇÜLEN %54,24 (2026-08-10, `utils` dâhil, 790 test).
# Eşik %50 — ~4 puanlık güvenli marj. CI kapsam bu eşiğin altına düşerse KIRILIR.
# Eski değer 33'tü ve gerçeğin 21 puan altındaydı: o kadar boşluk bırakan bir ratchet, büyük bir
# gerilemeyi bile sessizce geçirir (örn. bir modülün testlerinin tamamı silinse hâlâ yeşil kalır).
# Kademeli yükseltin (kritik yol testleri arttıkça).
fail_under = 50
show_missing = false

[tool.mypy]
python_version = "3.10"
# Kademeli tipleme (gradual typing): kod büyük ölçüde untyped → lenient başla; CI'da ZORUNLU DEĞİL.
ignore_missing_imports = true
follow_imports = "silent"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
exclude = "(ai_hub|dist|build|builds|buildPEMF|frontend|mobile|dema-terapi)/"
